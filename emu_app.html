:is(#mn,#dlg),:is(#mn,#dlg) :is(button,input,select,textarea,label,.h,.s,small,table,.dylg){font-family:UIPlay,-apple-system,system-ui,Roboto,sans-serif}
:is(#mn,#dlg),:is(#mn,#dlg) *{font-weight:400!important;font-synthesis:none}
:root{--bg:#000;--card:#0e0e0e;--bd:#2c2c2c;--fg:#f2f2f2;--mut:#8a8a8a;--ac:#f2f2f2;--bad:#ff2d2d;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
html,body{height:100%;margin:0}
body{position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,sans-serif;overflow:hidden}
body.flash,body.flash #bgl{animation:fl .18s steps(1) infinite}
@keyframes fl{0%{background:var(--sl,#f00)}50%{background:var(--bg)}}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{font-weight:600}
#bgl,#logo{position:absolute;inset:0;pointer-events:none}
#splash{position:absolute;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#splash.out{opacity:0;pointer-events:none}
#logo{display:flex;align-items:center;justify-content:center}
#top{position:relative;z-index:1;height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px}
#hb{font-size:24px;border:0;background:none;padding:2px 10px}
#pn{font-weight:600;min-width:70px;text-align:center}
#st{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
#st[data-c=g],#st[data-c=w],#st[data-c=r]{display:inline-flex;align-items:center;gap:6px}
#st[data-c=g]::before,#st[data-c=w]::before,#st[data-c=r]::before{content:'';width:8px;height:8px;border-radius:50%;flex:none;background:#3ad07a;box-shadow:0 0 6px currentColor}
#st[data-c=w]::before{background:#ffb020;animation:stp 1s ease-in-out infinite}
#st[data-c=r]::before{background:#ff3b3b}
@keyframes stp{50%{opacity:.25}}
#stage{flex:1;position:relative;z-index:1;margin:0 6px 6px;overflow:hidden}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;color:var(--mut);padding:20px}
.w{position:absolute;background:none;border:2px solid transparent;border-radius:12px;container-type:size;overflow:hidden;touch-action:none}
.w.g,.w.g.al{background:none;border-color:transparent}
.ed .w{outline:1.5px dashed rgba(255,255,255,.5);outline-offset:-2px}
.ed .w.g{outline:none}
.ed .w.g::before{content:'';position:absolute;inset:1px;border:1.5px dashed rgba(255,255,255,.5);border-radius:50%;pointer-events:none;z-index:1}
.rz{display:none;position:absolute;right:0;bottom:0;width:48px;height:48px;z-index:2}
.rz::after{content:'';position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:50%;background:var(--ac);border:2px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.ed .rz{display:block}
#stage.ed.gr{background-image:linear-gradient(to right,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.07) 1px,transparent 1px);background-size:var(--cs) var(--cs)}
.ed .w.bad{outline:2px solid #ff2d2d;outline-offset:-2px;background:rgba(255,45,45,.12)}.ed.lk .rz{display:none}.ed.lk .w{border-style:dotted}
.sl{width:100%;height:100%;display:flex;flex-direction:column-reverse;align-items:center;justify-content:space-evenly}
.dt{display:block;width:min(86cqw,calc(86cqh/var(--n)));aspect-ratio:1;border-radius:50%;background:#5a5a5a}
@container (min-aspect-ratio:1/1){.sl{flex-direction:row}.dt{width:min(86cqh,calc(86cqw/var(--n)))}}
.hz .sl{flex-direction:row}.hz .dt{width:min(86cqh,calc(86cqw/var(--n)))}
.bx{padding:3cqmin 5cqmin;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.bn{font-size:12cqmin;color:var(--pc,var(--mut));text-align:center}.nmm .bm{display:none}.nhd .bn{display:none!important}.nhd .bx{justify-content:center;gap:2cqmin}.nhd .bv{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:min(62cqh,34cqw);line-height:1}.nhd.nmm .bv{font-size:min(86cqh,34cqw)}.nhd.w7 .bv,.nhd.wL .bv{height:auto}.nhd.w7 .bv svg,.nhd.wL .bv svg{height:100%;max-width:100%}
.bv{color:var(--vc,var(--fg));font-size:40cqmin;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.bm{font-size:9cqmin;color:var(--pc,var(--mut));display:flex;justify-content:space-between}.bm b{color:var(--pc,var(--fg))}
.w7 .bn{font-weight:700}.w7 .bv{height:40cqmin;display:flex;justify-content:center}.w7 .bv svg{width:auto;height:100%;fill:currentColor}
.w7 .bm b{display:inline-flex;height:1em;vertical-align:-.12em}.w7 .bm b svg{width:auto;height:100%;fill:currentColor}
.wF .bx{font-family:GChk,sans-serif}.wF .bn{font-weight:600;letter-spacing:.16em}.wF .bv{font-weight:600;letter-spacing:-.02em}.wF .bm{font-weight:500;letter-spacing:.12em}
.wA .bx{font-family:GBar,'Arial Narrow',sans-serif}.wA .bn{font-weight:600;letter-spacing:.12em}.wA .bv{font-weight:600}.wA .bm{font-weight:500;letter-spacing:.06em}
.wL .bn{height:10cqmin;display:flex;justify-content:center}.wL .bn svg{width:auto;max-width:100%;height:100%;fill:currentColor}
.wL .bv{height:40cqmin;display:flex;justify-content:center}.wL .bv svg{width:auto;height:100%;fill:currentColor}
.wL .bm span{display:inline-flex;align-items:center;gap:.45em;height:1em}.wL .bm i,.wL .bm b{display:inline-flex;height:100%}.wL .bm i{height:80%}.wL .bm svg{width:auto;height:100%;fill:currentColor}
.al .bn,.al .bv,.al .gv{color:var(--al,var(--bad));fill:var(--al,var(--bad))}.al .nd{stroke:var(--al,var(--bad))}
svg{width:100%;height:100%;display:block}
.ta{fill:var(--arc,#ff2d2d);stroke:var(--arc,#ff2d2d)}.te{fill:var(--arce,#ff2d2d);stroke:var(--arce,#ff2d2d)}.ta,.te{stroke-width:.22;stroke-linejoin:round}
.as{stroke:var(--arc,#ff2d2d)}.af{fill:var(--arc,#ff2d2d)}.es{stroke:var(--arce,#ff2d2d)}.ef{fill:var(--arce,#ff2d2d)}
.c1f{fill:var(--c1)}.c1s{stroke:var(--c1)}.c2f{fill:var(--c2)}.c2s{stroke:var(--c2)}

#mn{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);background:var(--card);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .2s;z-index:5;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;overflow:auto}
#mn.open{transform:none}
#mn button{display:block;width:100%;text-align:left;margin-bottom:8px}
#mn .s{color:var(--mut);font-size:12px;margin:12px 0 6px}
#dlg{position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--card);border-top:1px solid var(--bd);padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:6}
#dlg.open{display:block}
body.ls #dlg label{margin:3px 0}body.ls #dlg input,body.ls #dlg select{padding:5px 8px}
body.ls #dlg{left:auto;top:44px;width:min(52%,430px);max-height:none;border-left:1px solid var(--bd);border-top:0;border-radius:0}
#dlg.fs{top:0;left:0;right:0;bottom:0;width:auto;max-height:none;border:0;border-radius:0;z-index:30}

ο με το κινητό στη βάση του και πάτα «Μηδενισμός θέσης κινητού».','Needs zeroing: stop on level ground with the phone in its mount and press “Zero phone position”.'],['Χρησιμοποιεί τους αισθητήρες του κινητού και τον ίδιο μηδενισμό με την κλίση δρόμου. Πάνω = επιτάχυνση, κάτω = φρένο, πλάι = στροφές. Υπάρχουν και κουτάκια «G διαμήκης» και «G πλευρική».','Uses the phone sensors and the same zero as road grade. Up = acceleration, down = braking, sides = corners. There are also “Long. G” and “Lat. G” tiles.'],['Διόρθωση για την κλίση του δρόμου','Road grade correction'],['μέγιστη ισχύς','peak power'],['μέγιστη ροπή','peak torque'],['Διαφορά','Difference'],['Στις','At'],['▶ Αναπαραγωγή','▶ Replay'],['Η κάθετη και η οριζόντια θέση έχουν','Portrait and landscape have a'],['ξεχωριστό layout','separate layout'],['. Με «Ξεκλείδωτο», όταν γυρίζεις το κινητό αλλάζει και το layout. Με «Κλειδωμένο», διαλέγεις εδώ ποιο layout θα φαίνεται (και ποιο επεξεργάζεσαι).','. When “Unlocked”, rotating the phone switches the layout. When “Locked”, choose here which layout is shown (and edited).'],

}

// Bluetooth, μόνο ανάγνωση (FFE1 notify)
// Κατάσταση σύνδεσης. s: off | conn | live | re (επανασύνδεση) | lost
const BT={s:'off',name:'',want:false,id:null,dev:null,n:0,fps:0,last:0,tries:0,timer:null,err:'',init:false};
function parse(){while(buf.length>=5){
  if(buf[1]===0xA3&&(((buf[0]+buf[1]+buf[2]+buf[3])&255)===buf[4]||(buf[0]+buf[1]+buf[2]+buf[3])%255===buf[4])){const i0=buf[0];raw[i0]=(buf[2]<<8)|buf[3];buf.splice(0,5);BT.n++;BT.last=Date.now();dyS(i0)}else buf.shift()}}
const onData=d=>{for(let i=0;i<d.byteLength;i++)buf.push(d.getUint8(i));parse();if(!RP.on)drawSoon()};
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&window.BleClient);
const U16=n=>'0000'+n+'-0000-1000-8000-00805f9b34fb',SV=U16('ffe0'),CH=U16('ffe1');
const BTK='emubt_dev'; // αποθηκευμένη συσκευή για αυτόματη σύνδεση (native)
// Ένδειξη πάνω δεξιά: τελεία (πράσινη/πορτοκαλί/κόκκινη) + κείμενο + frames/s
function stSet(){cDot();
  const e=$('#st');if(!e)return;let c='',l='';
  if(BT.s==='live'){const st=Date.now()-BT.last>2000;c=st?'w':'g';l=(st?'Χωρίς δεδομένα · ':'Live · ')+BT.name+(st?'':' · '+BT.fps+' fps')}
  else if(BT.s==='conn'){c='w';l='Σύνδεση…'}
  else if(BT.s==='re'){c='w';l='Επανασύνδεση… ('+BT.tries+')'}
  else if(BT.s==='lost'){c='r';l='Αποσυνδέθηκε'}
  else if(BT.err){c='r';l=BT.err}
  e.dataset.l=l;e.dataset.c=(edit||demo)?'':c;
  const x=edit?'Σύρε · γωνία ή 2 δάχτυλα: μέγεθος · κράτα πατημένο: ρυθμίσεις · ✓':(demo?'Demo':l);
  if(e.dataset.x!==x){e.dataset.x=x;e.textContent=x}
}
setInterval(()=>{BT.fps=BT.n;BT.n=0;if(BT.s==='live')stSet();cDot()},1000);
const btOn=()=>BT.s==='live'&&Date.now()-BT.last<2000; // κουκκίδα σύνδεσης στο μενού: μπλε = συνδεδεμένο, κόκκινη = όχι
function cDot(){const e=$('#cdot');if(e)e.classList.toggle('on',btOn());
  const a=$('#mct1');if(a){const live=BT.s==='live',s1=live?(btOn()?t('Συνδεδεμένο'):t('Χωρίς δεδομένα'))+(BT.name?' · '+BT.name:''):BT.s==='conn'||BT.s==='re'?t('Σύνδεση…'):t('Αποσυνδεδεμένο'),s2=live&&btOn()?BT.fps+' fps':BT.err||'';
    if(a.textContent!==s1)a.textContent=s1;const b=$('#mct2');if(b.textContent!==s2)b.textContent=s2}}
// Η οθόνη να μένει αναμμένη (στο native το κάνει και το MainActivity)
function keepOn(){try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(BT.want)keepOn()});
function goLive(first){
  if(first){demo=false;for(const k in raw)delete raw[k];for(const k in mm)delete mm[k];build()}
  BT.s='live';BT.tries=0;BT.err='';BT.last=Date.now();stSet();keepOn();
}
function btErr(e){BT.s='off';BT.want=false;const m=String(e&&e.message||e||'');
  BT.err=/cancel/i.test(m)?'':/^\d+$/.test(m.trim())?t('Δεν βρέθηκε συσκευή')+' ('+m.trim()+')':'Σφάλμα: '+m;stSet()}
function onLost(){if(!BT.want||BT.s==='off')return;BT.s='lost';stSet();retry()}
// Αυτόματη επανασύνδεση: κάθε 2, 4, 6… έως 10 δευτερόλεπτα, μέχρι να πατηθεί Αποσύνδεση
function retry(){
  clearTimeout(BT.timer);if(!BT.want)return;BT.tries++;BT.s='re';stSet();
  BT.timer=setTimeout(async()=>{
    if(!BT.want)return;
    try{
      if(isNative()){try{await BleClient.disconnect(BT.id)}catch(e){}await nOpen(BT.id)}
      else await wOpen(BT.dev);
      if(BT.want)goLive(false);
    }catch(e){retry()}
  },Math.min(2000*BT.tries,10000));
}
// Native Android (Capacitor): μόνο notify στο FFE1, ποτέ εγγραφή στο FFE2
async function nOpen(id){await BleClient.connect(id,onLost);try{await BleClient.requestConnectionPriority(id,1)}catch(e){}await BleClient.startNotifications(id,SV,CH,onData)}
async function connectNative(pick){
  clearTimeout(BT.timer);
  try{
    if(!BT.init){await BleClient.initialize();BT.init=true}
    let id=null,name='';
    if(!pick){try{const j=JSON.parse(localStorage.getItem(BTK)||'null');if(j){id=j.id;name=j.name}}catch(e){}}
    if(!id){
      if(BT.id){BT.want=false;try{await BleClient.disconnect(BT.id)}catch(e){}}
      const dev=await BleClient.requestDevice({namePrefix:'EMU',optionalServices:[SV]});id=dev.deviceId;name=dev.name||''}
    BT.id=id;BT.name=name;BT.want=true;BT.s='conn';stSet();
    try{localStorage.setItem(BTK,JSON.stringify({id,name}))}catch(e){}
    try{await nOpen(id)}catch(e){if(pick)throw e;retry();return} // αυτόματη σύνδεση: συνεχίζει να προσπαθεί
    goLive(true);
  }catch(e){btErr(e)}
}
// Web Bluetooth (Bluefy / iOS)
const WSTEP={c:'Σύνδεση με τη συσκευή',s:'Υπηρεσία FFE0',k:'Κανάλι FFE1',n:'Έναρξη δεδομένων'};
async function wOpen(dev){
  const wait=ms=>new Promise(r=>setTimeout(r,ms));let last=null,step='c';
  for(let i=0;i<3;i++){ // έως 3 προσπάθειες: στο iPhone η πρώτη σύνδεση GATT συχνά αποτυγχάνει
    try{step='c';if(i)await wait(700);const s=await dev.gatt.connect();await wait(250);
      step='s';let sv;try{sv=await s.getPrimaryService(SV)}catch(e){const all=await s.getPrimaryServices();sv=all.find(x=>String(x.uuid).toLowerCase().includes('ffe0'));if(!sv)throw e}
      step='k';let ch;try{ch=await sv.getCharacteristic(CH)}catch(e){const all=await sv.getCharacteristics();ch=all.find(x=>String(x.uuid).toLowerCase().includes('ffe1'));if(!ch)throw e}
      ch.oncharacteristicvaluechanged=e=>onData(e.target.value); // ανάθεση, όχι addEventListener: χωρίς διπλά δεδομένα μετά από επανασύνδεση
      step='n';await ch.startNotifications();return}
    catch(e){last=e;try{if(dev.gatt.connected)dev.gatt.disconnect()}catch(x){}}}
  const m=String(last&&last.message||last||'');throw new Error(t(WSTEP[step])+(m?': '+m:''))}
async function connect(all){
  if(isNative())return connectNative(true);
  if(!navigator.bluetooth){bluefyPage();return}
  try{
    // όνομα EMU… ή υπηρεσία FFE0 (στο iPhone το όνομα μπορεί να μη φαίνεται)· all = όλες οι συσκευές
    const dev=await navigator.bluetooth.requestDevice(all?{acceptAllDevices:true,optionalServices:[SV]}:{filters:[{namePrefix:'EMU'},{services:[SV]}],optionalServices:[SV]});
    if(BT.dev&&BT.dev!==dev){BT.want=false;try{BT.dev.gatt.disconnect()}catch(e){}}

const carNew=(p)=>Object.assign({id:Date.now()+Math.floor(Math.random()*1000),name:'Νέο αυτοκίνητο'},JSON.parse(JSON.stringify(p||{g:DYC.g.slice()})));
// Προφίλ αυτοκινήτων: S.dyno.cars (λίστα), S.dyno.ac (ενεργό id). Το S.dyno.car δείχνει πάντα στο ενεργό προφίλ.

const dGears=c=>c.g.map((x,i)=>x>0?i+1:0).filter(Boolean);
const dCirc=c=>Math.PI*(c.rim*25.4+2*c.tw*c.ta/100)/1000*.97; // 0.97: φορτωμένη ακτίνα
const dK=(c,g)=>dCirc(c)/((c.g[(g||c.gear)-1]||1)*c.fd*60); // m/s ανά 1 rpm
const dRho=c=>(S.baro||100)*1000/(287.05*(c.amb+273.15));

// Τοπική τετραγωνική παλινδρόμηση: εξομαλυμένες στροφές και ρυθμός μεταβολής (rpm/s)
function lq(s,i,W){
  const t0=s[i].t;let n=0,a1=0,a2=0,a3=0,a4=0,y0=0,y1=0,y2=0;
  const ac=j=>{const x=s[j].t-t0,y=s[j].r,x2=x*x;n++;a1+=x;a2+=x2;a3+=x2*x;a4+=x2*x2;y0+=y;y1+=x*y;y2+=x2*y};
  for(let j=i;j>=0&&t0-s[j].t<=W;j--)ac(j);
  for(let j=i+1;j<s.length&&s[j].t-t0<=W;j++)ac(j);
  if(n<5)return null;
  const d3=(a,b,c,d,e,f,g,h,k)=>a*(e*k-f*h)-b*(d*k-f*g)+c*(d*h-e*g);
  const D=d3(n,a1,a2,a1,a2,a3,a2,a3,a4);if(Math.abs(D)<1e-12)return null;
  return{r:d3(y0,a1,a2,y1,a2,a3,y2,a3,a4)/D,d:d3(n,y0,a2,a1,y1,a3,a2,y2,a4)/D};
}

function dyCalc(s0,c){
  if(s0.length<12)return{err:'Πολύ λίγα δεδομένα. Ξαναδοκίμασε με πιο μεγάλο τράβηγμα.'};
  let iM=0;s0.forEach((x,i)=>{if(x.r>s0[iM].r)iM=i});
  let i0=0;for(let i=0;i<=iM;i++)if(s0[i].r<=s0[i0].r)i0=i;
  const s=s0.slice(i0,iM+1);
  if(s.length<10||s[s.length-1].r-s[0].r<1200)return{err:'Το εύρος στροφών ήταν μικρό. Ξεκίνα από χαμηλότερες στροφές και κράτα τέρμα μέχρι τον κόφτη.'};
  const T0=s[0].t,T1=s[s.length-1].t;
  if(T1-T0<1)return{err:'Η μέτρηση ήταν πολύ σύντομη. Χρησιμοποίησε μεγαλύτερη ταχύτητα (π.χ. 3η ή 4η).'};
  const k=dK(c),gr=c.g[c.gear-1]*c.fd,me=c.m*(1.04+.0025*gr*gr),rho=dRho(c),W=Math.max(.25,Math.min(.6,(T1-T0)/12)),B={};
  const gs=s.map(x=>x.g).filter(x=>x!=null&&isFinite(x)),gA=gs.length>s.length*.5?gs.reduce((a,b)=>a+b,0)/gs.length:null,sinG=gA==null?0:Math.sin(Math.atan(gA/100)); // μέση κλίση δρόμου
  s.forEach((x,i)=>{
    if(x.t-T0<W*.5||T1-x.t<W*.5)return;
    const f=lq(s,i,W);if(!f||f.d<50)return;
    const v=f.r*k,a=f.d*k,Pw=me*a*v+.5*rho*c.cd*c.fa*v*v*v+c.crr*c.m*9.81*v+c.m*9.81*sinG*v; // + ισχύς για την ανηφόρα (ή − για κατηφόρα)
    const b=Math.round(f.r/100)*100,o=B[b]||(B[b]={n:0,w:0,a:0,an:0,b:0,bn:0});
    o.n++;o.w+=Pw;if(x.a!=null){o.a+=x.a;o.an++}if(x.b!=null){o.b+=x.b;o.bn++}
  });
  let pts=Object.keys(B).map(Number).sort((a,b)=>a-b).map(r=>{const o=B[r];return{r,w:o.w/o.n,a:o.an?o.a/o.an:null,b:o.bn?o.b/o.bn:null}});
  if(pts.length<5)return{err:'Δεν βρέθηκε καθαρό τράβηγμα. Κράτα γκάζι τέρμα σε μία ταχύτητα χωρίς να πατάς συμπλέκτη.'};
  const K=[1,2,3,2,1];
  pts=pts.map((p,i)=>{let sw=0,sx=0;K.forEach((kk,j)=>{const q=pts[i+j-2];if(q&&Math.abs(q.r-p.r)<=250){sw+=kk;sx+=kk*q.w}});return Object.assign({},p,{w:sx/sw})});
  const lf=1-c.loss/100;
  pts.forEach(p=>{p.p=p.w/lf;p.q=p.p/(p.r*Math.PI/30)});
  return{pts,gr:gA==null?null:+gA.toFixed(1)};
}

// Καταγραφή: καλείται για κάθε πλαίσιο που φτάνει από τον EMU
function dyS(id){
  if((DY.st!=='armed'&&DY.st!=='rec')||id!==get(M.rpm,'id'))return;
  const r=bv(M.rpm),p=bv(M.tps),t=performance.now()/1000,c=dCar();
  if(r==null)return;
  if(DY.st==='armed'){if(r<700||(p!=null&&p<c.tps))return;DY.st='rec';DY.s=[];DY.mx=r;DY.mn=r;DY.mt=t}
  DY.s.push({t,r,p,a:bv(M.afr),b:bv(M.boost),g:TL.v}); // g: κλίση δρόμου % (αν έχει γίνει μηδενισμός)
  if(r>DY.mx+20){DY.mx=r;DY.mt=t}
  if(r<DY.mn)DY.mn=r;
  const dur=t-DY.s[0].t,pulled=DY.mx-DY.mn>800;
  if(dur>40||(dur>.6&&((p!=null&&p<c.tps-20)||(pulled&&(r<DY.mx-350||t-DY.mt>1.2)))))dyEnd();
}

// Demo: προσομοίωση τραβήγματος με γνωστή καμπύλη ροπής (165 Nm @ 4800)
function dySimStart(){
  dyStopSim();
  const c=dCar(),k=dK(c),gr=c.g[c.gear-1]*c.fd,me=c.m*(1.04+.0025*gr*gr),rho=dRho(c),rw=dCirc(c)/(2*Math.PI),lim=(S.rpmMax||7200)-100;

  DY.sim=setInterval(()=>{

    if(ph===0&&el>.8)ph=1;
    let tps=4;
    if(ph===1){tps=100;while(dt>0){const h=Math.min(dt,.005),v=rpm*k,F=tq(rpm)*gr*(1-c.loss/100)/rw-.5*rho*c.cd*c.fa*v*v-c.crr*c.m*9.81;rpm=(v+F/me*h)/k;dt-=h}
      if(rpm>=lim){ph=2;te=el}}
    else if(ph===2){tps=0;rpm=Math.max(1500,rpm-2500*dt);if(el-te>2)dyStopSim()}
    setV(M.rpm,rpm+(Math.random()-.5)*10);setV(M.tps,tps);setV(M.map,tps>50?185:35);setV(M.afr,tps>50?11.8+Math.random()*.3:14.7);
    dyS(get(M.rpm,'id'));

// Γράφημα ισχύος / ροπής
function dyChart(cv,runs,cur,pu){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const all=runs.flatMap(x=>x.pts);if(!all.length)return;
  const L=42,Rm=42,T=12,Bm=24,pw=W-L-Rm,ph=H-T-Bm,u=PU[pu]||PU.ps;
  const r0=Math.floor(Math.min(...all.map(p=>p.r))/500)*500;let r1=Math.ceil(Math.max(...all.map(p=>p.r))/500)*500;if(r1<=r0)r1=r0+500;
  const pm=Math.max(...all.map(p=>p.p/u[1]))*1.12||1,qm=Math.max(...all.map(p=>p.q))*1.12||1;
  const X=r=>L+(r-r0)/(r1-r0)*pw,YP=v=>T+ph-v/pm*ph,YQ=v=>T+ph-v/qm*ph;
  cv._r=x=>cl(r0+(x-L)/pw*(r1-r0),r0,r1);
  g.font='11px -apple-system,system-ui,sans-serif';g.lineWidth=1;g.strokeStyle='#2a2a2a';g.fillStyle='#8a8a8a';
  g.textAlign='right';g.textBaseline='middle';
  lbls(0,pm).forEach(v=>{const y=YP(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillText(v,L-6,y)});
  g.textAlign='left';lbls(0,qm).forEach(v=>g.fillText(v,L+pw+6,YQ(v)));
  g.textAlign='center';g.textBaseline='top';const stp=(r1-r0)>4000?1000:500;
  for(let r=r0;r<=r1;r+=stp){const x=X(r);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.fillText(r,x,T+ph+6)}
  const line=(pts,f,col,w,dash,al)=>{g.save();g.strokeStyle=col;g.globalAlpha=al||1;g.lineWidth=w;g.setLineDash(dash||[]);g.lineJoin='round';g.beginPath();pts.forEach((p,i)=>{const x=X(p.r),y=f(p);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.restore()};
  runs.forEach(x=>{
    if(runs.length===1)line(x.pts,p=>YP(p.w/u[1]),x.col,1.5,[],.45);
    line(x.pts,p=>YP(p.p/u[1]),x.col,2.6);
    line(x.pts,p=>YQ(p.q),runs.length===1?'#f2f2f2':x.col,2,[6,4]);
  });
  if(cur!=null){const x=X(cur);g.save();g.strokeStyle='#fff';g.globalAlpha=.6;g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.restore()}
}
// Γράφημα AFR (και boost αν υπάρχει)
function dyChart2(cv,runs,cur){
  const all=runs.flatMap(x=>x.pts),A=all.filter(p=>p.a!=null).map(p=>p.a),Bs=all.filter(p=>p.b!=null).map(p=>fromBase('boost',p.b));
  if(!A.length){cv.style.display='none';return}cv.style.display='';
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const L=42,Rm=42,T=8,Bm=8,pw=W-L-Rm,ph=H-T-Bm;
  const r0=Math.floor(Math.min(...all.map(p=>p.r))/500)*500;let r1=Math.ceil(Math.max(...all.map(p=>p.r))/500)*500;if(r1<=r0)r1=r0+500;
  let a0=Math.floor(Math.min(...A)-.5),a1=Math.ceil(Math.max(...A)+.5);
  const hb=Bs.length&&Math.max(...Bs)>0.05,b0=hb?Math.min(0,...Bs):0,b1=hb?Math.max(...Bs)*1.15:1;
  const X=r=>L+(r-r0)/(r1-r0)*pw,YA=v=>T+ph-(v-a0)/(a1-a0)*ph,YB=v=>T+ph-(v-b0)/(b1-b0)*ph;
  g.font='11px -apple-system,system-ui,sans-serif';g.lineWidth=1;g.strokeStyle='#2a2a2a';g.fillStyle='#8a8a8a';g.textBaseline='middle';
  g.textAlign='right';lbls(a0,a1).forEach(v=>{const y=YA(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillText(v,L-6,y)});
  if(hb){g.textAlign='left';lbls(b0,b1).forEach(v=>g.fillText(v,L+pw+6,YB(v)))}
  const line=(pts,f,col,w,dash)=>{g.save();g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();let st=false;pts.forEach(p=>{const y=f(p);if(y==null){st=false;return}const x=X(p.r);st?g.lineTo(x,y):g.moveTo(x,y);st=true});g.stroke();g.restore()};
  runs.forEach(x=>{
    line(x.pts,p=>p.a==null?null:YA(p.a),runs.length===1?'#ffb020':x.col,2);
    if(hb)line(x.pts,p=>p.b==null?null:YB(fromBase('boost',p.b)),runs.length===1?'#2d9bff':x.col,1.6,[5,4]);
  });
  if(cur!=null){const x=X(cur);g.save();g.strokeStyle='#fff';g.globalAlpha=.6;g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.restore()}
}
// Σύνδεση γραφημάτων με αφή (δείχνει τιμές στις στροφές που πατάς)

      if(cur!=null){const at=x=>{let q=null;x.pts.forEach(p=>{if(Math.abs(p.r-cur)<=150&&(!q||Math.abs(p.r-cur)<Math.abs(q.r-cur)))q=p});return q},a=at(runs[0]),b=at(runs[1]);
        if(a&&b)d+='<br>'+t('Στις')+' '+Math.round(cur)+' rpm: '+sg(((b.p-a.p)/u[1]).toFixed(1))+' '+u[0]+' · '+sg((b.q-a.q).toFixed(0))+' Nm'}
      h+='<div class="dym">'+d+'</div>'}
    ro.innerHTML=h};
  const hit=(el,ev)=>{const rc=el.getBoundingClientRect(),x=rot?ev.clientY-rc.top:ev.clientX-rc.left;return cv._r?cv._r(x):null};

    if(i>=0){if(DY.sel.length>1)DY.sel.splice(i,1)}else{if(DY.sel.length>=4)DY.sel.shift();DY.sel.push(id)}
    draw()};
  draw();
}

// Τριπλέτα: 3 αναλογικά (μεσαίο μεγάλο), 2 κουτάκια πάνω από κάθε πλαϊνό όργανο. Γεωμετρία σε pixels της σκηνής → %.
const LAYS={t1:{n:'Τριπλέτα οργάνων',
  geo(W,H){const g=6,R=[];const P=(x,y,w,h)=>({x:x/W*100,y:y/H*100,w:w/W*100,h:h/H*100});
    if(W>=H){const B=Math.min(H,W*.42),bx=(W-B)/2,Sw=bx-2*g,th=H*.17,s=Math.min(Sw,H-2*th-2*g),sy=(H-s)/2; // κάθε πλαϊνή στήλη: κουτάκι, όργανο, κουτάκι

let sw=null;
$('#stage').addEventListener('pointerdown',e=>{
  $('#mn').classList.remove('open');
  const wd=e.target.closest('.w'),ch=e.target.closest('#empty[data-ch]');
  if(!ch&&(!wd||!edit))sw={x:e.clientX,y:e.clientY};
  if(!edit||wd||ch||LKP())return;
  const x0=e.clientX,y0=e.clientY;let t;
  const cancel=()=>{clearTimeout(t);removeEventListener('pointermove',mv);removeEventListener('pointerup',cancel);removeEventListener('pointercancel',cancel)};
  const mv=ev=>{if(Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)>10)cancel()};
  addEventListener('pointermove',mv);addEventListener('pointerup',cancel);addEventListener('pointercancel',cancel);
  t=setTimeout(()=>{cancel();sw=null;{const r=$('#stage').getBoundingClientRect(),G=GD();NEWAT={x:cl(Math.floor((x0-r.left)/G.cs),0,G.C-1),y:cl(Math.floor((y0-r.top)/G.cs),0,G.R-1)}}dlgW({t:'b',k:'rpm'},true)},550);
});
addEventListener('pointerup',e=>{
  if(!sw)return;const dx=rot?(e.clientY-sw.y):(e.clientX-sw.x),dy=rot?-(e.clientX-sw.x):(e.clientY-sw.y);sw=null;

});

    else if(k==='perf'){cm();perfPage()}
    else if(k==='gm'){cm();gPage()}
    else if(k==='units'){cm();unitsPage()}
    else if(k==='sl'){cm();shiftPanel()}
    else{oc=oc===k?null:k;menu()}
    return}
  const a=b.dataset.a;
  if(a==='sl'){cm();shiftPanel()}
  else if(a==='c'){cm();connect()}
  else if(a==='x'){cm();disconnect()}
  else if(a==='u'){cm();unitsPage()}

  else if(a==='t'){cm();thPanel()}
  else if(a==='b'){cm();bgPanel()}

  else if(a==='k'){cm();panel()}
  else if(a==='gr'){cm();gradePage()}
  else if(a==='dr'){cm();dyRun()}
  else if(a==='dc'){cm();dyCar()}
  else if(a==='dh'){cm();dyHist()}

  else if(a==='lg'){setLang(S.lang==='en'?'el':'en');menu()}
  else if(a==='r'){if(cf(t('Διαγραφή όλων των ρυθμίσεων και των οργάνων;'))){try{localStorage.removeItem('emudash2')}catch(e){}location.reload()}}
});

function splash(){
  const e=$('#splash');
  if(S.logo===false){e.remove();return}
  if(rot){const W=innerWidth,H=innerHeight;Object.assign(e.style,{inset:'auto',width:W+'px',height:H+'px',left:(H-W)/2+'px',top:(W-H)/2+'px',transform:'rotate(-90deg)'})} // όρθιο ως προς τον χρήστη
  const go=()=>{e.classList.add('out');setTimeout(()=>e.remove(),800)};e.onclick=go;
  if(S.logoi){e.innerHTML='<img src="'+S.logoi+'" style="max-width:80%;max-height:80%">';setTimeout(go,2200);return}
  const k=Math.min(.8*e.offsetWidth/SPL.w,.8*e.offsetHeight/SPL.h);
  e.innerHTML='<svg width="'+SPL.w*k+'" height="'+SPL.h*k+'" viewBox="0 0 '+SPL.w+' '+SPL.h+'"><defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="-202" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fc5a0e"/><stop offset="1" stop-color="#f20a18"/></linearGradient></defs><image href="'+SPL.img+'" width="'+SPL.w+'" height="'+SPL.h+'"/><g id="sn"><polygon fill="url(#ng)" points="-25,-1.5 14,-28 0,-202"/><circle r="24.3" fill="#fc5a0e"/></g></svg>';
  const n=$('#sn'),t0=performance.now(),A0=-60,A1=97,R=SPL.rest,ez=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  (function f(t){
    const q=t-t0;let a;
    if(q<150)a=A0;else if(q<1400)a=A0+(A1-A0)*ez((q-150)/1250);else if(q<2000){const u=(q-1400)/600;a=A1+(R-A1)*(1-Math.pow(1-u,3))}else a=R;
    n.setAttribute('transform','translate('+SPL.x+' '+SPL.y+') rotate('+a+')');
    if(q<2000&&document.body.contains(n))requestAnimationFrame(f);
  })(t0);
  setTimeout(go,2700);
}
document.documentElement.lang=S.lang==='en'?'en':'el';applyBg();fit();build();splash();if(S.lang==='en')trNode(document.body);
