<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMU Dash</title>
<style>
:root{--bg:#000;--card:#0e0e0e;--bd:#2c2c2c;--fg:#f2f2f2;--mut:#8a8a8a;--ac:#f2f2f2;--bad:#ff2d2d;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,sans-serif;overflow:hidden}
body.flash,body.flash #bgl{animation:fl .18s steps(1) infinite}
@keyframes fl{0%{background:var(--sl,#f00)}50%{background:var(--bg)}}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{font-weight:600}
#bgl,#logo{position:absolute;inset:0;pointer-events:none}
#splash{position:absolute;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#splash.out{opacity:0;pointer-events:none}
#logo{display:flex;align-items:center;justify-content:center}
#top{position:relative;z-index:1;height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px}
#hb{font-size:24px;border:0;background:none;padding:2px 10px}
#pn{font-weight:600;min-width:70px;text-align:center}
#st{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
#stage{flex:1;position:relative;z-index:1;margin:0 6px 6px;overflow:hidden}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;color:var(--mut);padding:20px}
.w{position:absolute;background:rgba(0,0,0,.55);border:2px solid var(--bd);border-radius:12px;container-type:size;overflow:hidden;touch-action:none}
.w.al{border-color:var(--bad)}
.w.g,.w.g.al{background:none;border-color:transparent}
.ed .w{outline:2px dashed var(--ac);outline-offset:-6px}
.rz{display:none;position:absolute;right:0;bottom:0;width:30px;height:30px;background:var(--ac);opacity:.85;border-radius:8px 0 10px 0}
.ed .rz{display:block}
.bx{padding:3cqmin 5cqmin;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.bn{font-size:12cqmin;color:var(--mut)}
.bv{font-size:40cqmin;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.bm{font-size:9cqmin;color:var(--mut);display:flex;justify-content:space-between}.bm b{color:var(--fg)}
.al .bn,.al .bv,.al .gv{color:var(--bad);fill:var(--bad)}.al .nd{stroke:var(--bad)}
svg{width:100%;height:100%;display:block}
.c1f{fill:var(--c1)}.c1s{stroke:var(--c1)}.c2f{fill:var(--c2)}.c2s{stroke:var(--c2)}
.al .lit{stroke:var(--bad)}.al polygon.lit{fill:var(--bad)}
#mn{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);background:var(--card);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .2s;z-index:5;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;overflow:auto}
#mn.open{transform:none}
#mn button{display:block;width:100%;text-align:left;margin-bottom:8px}
#mn .s{color:var(--mut);font-size:12px;margin:12px 0 6px}
#dlg{position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--card);border-top:1px solid var(--bd);padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:6}
#dlg.open{display:block}
#dlg label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:10px}
#dlg input{width:90px}#dlg h3{margin:0 0 6px}
table{border-collapse:collapse;font-size:13px}th,td{padding:3px 4px;text-align:left;white-space:nowrap}
.h{color:var(--mut);font-size:12px;margin:8px 0}
</style>
</head>
<body>
<div id="bgl"></div><div id="logo"></div><div id="splash"></div>
<div id="top"><button id="hb">☰</button><button id="pv">‹</button><span id="pn"></span><button id="nx">›</button><span id="st">Demo</span></div>
<div id="stage"></div>
<div id="mn"></div>
<div id="dlg"></div>

<script>
const $=q=>document.querySelector(q);
const hx=n=>Number(n).toString(16).toUpperCase().padStart(2,'0');
const on=x=>x!=null&&x!=='';
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),sn=v=>Math.round(v/2)*2;
// ok=1 σίγουρο, ok=0 υπόθεση. Τα ID είναι hex όπως στην αναφορά του καταγραφέα.
const DEF=[
{k:'rpm',n:'rpm',id:1,s:1,o:0,d:0,ok:1,min:0,max:8000},
{k:'map',n:'MAP kPa',id:2,s:1,o:0,d:0,ok:1,min:0,max:300},
{k:'boost',n:'Boost bar ?',d:2,ok:0,min:-1,max:2},
{k:'tps',n:'TPS %',id:3,s:1,o:0,d:0,ok:1,min:0,max:100},
{k:'ect',n:'Νερό °C ?',id:6,s:1,o:0,d:0,ok:0,min:40,max:120},
{k:'iat',n:'IAT °C ?',id:4,s:1,o:0,d:0,ok:0,min:0,max:80},
{k:'afr',n:'AFR ?',id:0x10,s:.1,o:0,d:1,ok:0,min:8,max:20},
{k:'bat',n:'Μπαταρία V ?',id:5,s:.027,o:0,d:1,ok:0,min:8,max:16},
{k:'spd',n:'km/h ?',id:null,s:1,o:0,d:0,ok:0,min:0,max:260}
];
const M={};DEF.forEach(c=>M[c.k]=c);
let S={};try{S=JSON.parse(localStorage.getItem('emudash2'))||{}}catch(e){}
S.pages=S.pages||[{n:'Σελίδα 1',w:[]}];S.cur=S.cur||0;S.ch=S.ch||{};
if(S.baro==null)S.baro=100;S.col=S.col||'#ff2d2d';
const save=()=>{try{localStorage.setItem('emudash2',JSON.stringify(S));return true}catch(e){return false}};
const get=(c,f)=>{const v=(S.ch[c.k]||{})[f];return v!==undefined?v:c[f]};
let edit=false,demo=true,buf=[],cal=false,rot=false;const raw={},mm={},refs=new Map();
function fit(){
  const b=document.body,w=innerWidth,h=innerHeight;
  rot=S.orient!=='p'&&h>w;
  if(rot)Object.assign(b.style,{position:'fixed',left:'0',top:'0',width:h+'px',height:w+'px',transformOrigin:'0 0',transform:'translateX('+w+'px) rotate(90deg)'});
  else b.removeAttribute('style');
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));

function val(c){
  if(c.k==='boost'){const m=val(M.map);return m==null?null:(m-S.baro)/100}
  const id=get(c,'id');if(id==null||raw[id]===undefined)return null;
  return raw[id]*get(c,'s')+get(c,'o');
}
const pt=a=>{const r=a*Math.PI/180;return(50+38*Math.sin(r)).toFixed(1)+' '+(55-38*Math.cos(r)).toFixed(1)};
const pos=(d,w)=>{d.style.left=w.x+'%';d.style.top=w.y+'%';d.style.width=w.w+'%';d.style.height=w.h+'%'};

function mk(w){
  const c=M[w.k],d=document.createElement('div');d.className='w'+(w.t==='g'?' g':'');pos(d,w);
  d.innerHTML=(w.t==='g'
   ?gsvg(w,S.theme||'l')
   :`<div class="bx"><div class="bn">${c.n}</div><div class="bv">-</div><div class="bm"><span>Min <b>-</b></span><span>Max <b>-</b></span></div></div>`)
   +'<div class="rz"></div>';
  d.addEventListener('pointerdown',e=>drag(e,w,d));
  refs.set(w,d);return d;
}
// Θέματα αναλογικών οργάνων
const P=(r,a,cx=50,cy=55)=>{const t=a*Math.PI/180;return[+(cx+r*Math.sin(t)).toFixed(1),+(cy-r*Math.cos(t)).toFixed(1)]};
function lbls(a,b){const r=b-a,m=Math.pow(10,Math.floor(Math.log10(r/6))),f=[1,2,2.5,5,10].find(x=>r/(x*m)<=7)*m,o=[];for(let v=Math.ceil(a/f-1e-9)*f;v<=b+1e-9;v+=f)o.push(+v.toFixed(6));return o}
const SG={a:'M2 0H8L9 1L8 2H2L1 1Z',d:'M2 16H8L9 17L8 18H2L1 17Z',g:'M2 8H8L9 9L8 10H2L1 9Z',b:'M9 1L10 2V8L9 9L8 8V2Z',c:'M9 10L10 11V16L9 17L8 16V11Z',f:'M1 1L2 2V8L1 9L0 8V2Z',e:'M1 10L2 11V16L1 17L0 16V11Z'};
const DG={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g'};
function seg7(str,x,y,sx,sy,al,sk){
  let tw=0;for(const ch of str)tw+=ch==='.'?4:12;tw-=2;
  let cx=al==='c'?x-tw*sx/2:x-tw*sx,o='';
  for(const ch of str){
    if(ch==='.'){o+='<circle cx="'+(cx+1.2*sx).toFixed(1)+'" cy="'+(y+16.6*sy).toFixed(1)+'" r="1.3"/>';cx+=4*sx;continue}
    const d=(DG[ch]||'').split('').map(k=>SG[k]).join('');
    if(d)o+='<path d="'+d+'" transform="translate('+cx.toFixed(1)+' '+y+') scale('+sx+' '+sy+')"/>';
    cx+=12*sx;
  }
  return sk?'<g transform="translate('+(-Math.tan(sk*Math.PI/180)*(+y+9*sy)).toFixed(2)+' 0) skewX('+sk+')">'+o+'</g>':o;
}
const DEFS='<defs><linearGradient id="bz1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3c3c3c"/><stop offset=".5" stop-color="#060606"/><stop offset="1" stop-color="#2c2c2c"/></linearGradient><linearGradient id="bz2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f6f6"/><stop offset=".45" stop-color="#8b8b8b"/><stop offset="1" stop-color="#dcdcdc"/></linearGradient><linearGradient id="bz3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303030"/><stop offset="1" stop-color="#080808"/></linearGradient></defs>';
const Q=(r,a)=>P(r,a,50,50);
const arcp=(r,a0,a1)=>{const p=Q(r,a0),q=Q(r,a1);return'M'+p[0]+' '+p[1]+'A'+r+' '+r+' 0 0 1 '+q[0]+' '+q[1]};
const ln=(r1,r2,a,cl,sw,ex)=>{const p=Q(r1,a),q=Q(r2,a);return'<line class="'+cl+'" x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke-width="'+sw+'" '+(ex||'')+'/>'};
const hl=(r,list,op)=>list.map(a=>'<path d="'+arcp(r,a[0],a[1])+'" fill="none" stroke="#fff" stroke-opacity="'+op+'" stroke-width=".9" stroke-linecap="round"/>').join('');
function gsvg(w,th){
  const c=M[w.k],nm=c.n.replace(/ \?$/,'');
  if(th==='s')return `<svg viewBox="0 0 100 100"><path d="M${pt(-135)} A38 38 0 1 1 ${pt(135)}" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/><line class="nd" x1="50" y1="55" x2="50" y2="26" stroke="#e9eef2" stroke-width="2.5" stroke-linecap="round" transform="rotate(-135 50 55)"/><circle cx="50" cy="55" r="4" fill="#e9eef2"/><text class="gv" x="50" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#e9eef2">-</text><text x="50" y="94" text-anchor="middle" font-size="8" fill="#7d8894">${c.n}</text></svg>`;
  const T=(x,y,z,cl,t,ex)=>'<text class="'+cl+'" x="'+x+'" y="'+y+'" font-size="'+z+'" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" '+(ex||'')+'>'+t+'</text>';
  const op=(a0,a1)=>'<svg viewBox="0 0 100 100" data-n="'+a0+','+a1+',50,50">'+DEFS;
  const dig=(x,y,sx,sy,al,sk)=>'<g class="gv c1f" data-p="'+[x,y,sx,sy,al,sk].join(',')+'">'+seg7('-',x,y,sx,sy,al,sk)+'</g>';
  const L=lbls(w.min,w.max),f=L.length>1?L[1]-L[0]:1;
  let h;
  if(th==='l'){
    const A0=-128,A1=128,fr=v=>A0+(A1-A0)*(v-w.min)/(w.max-w.min);
    h=op(A0,A1)+'<circle cx="50" cy="50" r="49.5" fill="url(#bz1)"/><circle cx="50" cy="50" r="44.5" fill="#000" stroke="#222"/>'+hl(47.2,[[-70,-35],[28,58],[120,150],[-150,-120]],.3);
    for(let i=0;i<28;i++)h+=ln(36,41.5,A0+(A1-A0)*i/27,'sg c1s',2.7,'stroke-opacity=".14"');
    L.forEach(v=>{h+=ln(29,33.5,fr(v),'c2s',.9);if(v+f/2<=w.max)h+=ln(31,33.5,fr(v+f/2),'c2s',.6);const q=Q(24.5,fr(v));h+=T(q[0],q[1]+2,5.6,'c2f',+v.toFixed(2),'font-weight="600"')});
    h+=dig(50,41,.72,.83,'c',-6)+T(50,64.5,6,'c2f',nm,'font-weight="700"');
    h+=T(36,79,3,'c2f','WARN')+T(64,79,3,'c2f','PEAK');
    [[38,85],[62,85]].forEach(q=>h+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.1" fill="#121212" stroke="#444" stroke-width=".7"/>');
  }else if(th==='c'){
    const A0=w.min<0?-170:-135,A1=w.min<0?90:135,fr=v=>A0+(A1-A0)*(v-w.min)/(w.max-w.min),sub=f/5;
    h=op(A0,A1)+'<circle cx="50" cy="50" r="49.5" fill="url(#bz2)"/><circle cx="50" cy="50" r="44" fill="#000" stroke="#333" stroke-width=".8"/>'+hl(47,[[-60,-20],[130,165]],.8);
    for(let v=Math.ceil(w.min/sub-1e-9)*sub;v<=w.max+1e-9;v+=sub){const mj=Math.abs(v/f-Math.round(v/f))<1e-6;h+=ln(mj?37.5:40.2,42.6,fr(v),'c2s',mj?1.1:.45)}
    L.forEach(v=>{const q=Q(29.5,fr(v)),sm=v<0;h+=T(q[0],q[1]+(sm?1.6:2.8),sm?4.5:8,'c2f',+Math.abs(v).toFixed(2),'font-weight="700" font-style="italic"')});
    h+=T(77,59.5,6.2,'c2f',nm,'font-weight="800"');
    h+='<polygon class="nd c1f" points="49.2,56 50.8,56 50.4,12.5 49.6,12.5" transform="rotate('+A0+' 50 50)"/>';
  }else{
    const A0=-128,A1=128,fr=v=>A0+(A1-A0)*(v-w.min)/(w.max-w.min),ghost=Math.abs(w.max).toFixed(c.d).replace(/[0-9]/g,'8');
    h=op(A0,A1)+'<circle cx="50" cy="50" r="49.5" fill="#111"/><circle cx="50" cy="50" r="45.5" fill="url(#bz3)" stroke="#2c2c2c" stroke-width=".8"/><circle cx="50" cy="50" r="42" fill="#000"/>'+hl(43.8,[[-75,-30],[35,70]],.22);
    for(let i=0;i<30;i++){const a=A0+(A1-A0)*i/30,b=a+(A1-A0)/30*.7,p=[Q(28.5,a),Q(33,a),Q(33,b),Q(28.5,b)].map(q=>q.join(',')).join(' ');h+='<polygon class="sg c1f" points="'+p+'" fill-opacity=".14"/>'}
    L.forEach(v=>{const q=Q(24.5,fr(v));h+=T(q[0],q[1]+1.2,3.3,'c2f',+v.toFixed(2),'fill-opacity=".85"')});
    const nn=ghost.replace('.','').length,tw=nn*12+(ghost.includes('.')?4:0)-2,sx=Math.min(.85,33/tw),xr=+(50+tw*sx/2).toFixed(1);
    h+='<g class="c1f" fill-opacity=".13">'+seg7(ghost,xr,35,sx,.8,'r',0)+'</g>'+dig(xr,35,sx,.8,'r',0);
    h+=T(50,60,7,'c1f',nm,'font-weight="800"');
    h+='<rect class="c1f" x="29" y="65" width="11" height="5" rx="1.5" fill-opacity=".85"/><rect class="c1f" x="60" y="65" width="11" height="5" rx="1.5" fill-opacity=".85"/>';
    h+='<polygon points="22,71 78,71 86,80 80,93 20,93 14,80" fill="#0a0a0a" stroke="#2b2b2b" stroke-width=".6"/>';
    [[33,83],[50,86.5],[67,83]].forEach(q=>h+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.3" fill="#141414" stroke="#3a3a3a" stroke-width=".7"/>');
    h+='<polygon points="31,75.5 35,75.5 33,78.5" fill="#ddd"/><polygon points="65,78.5 69,78.5 67,75.5" fill="#ddd"/>'+T(50,81,3.2,'','M','fill="#ddd"');
  }
  return h+'</svg>';
}
function gupd(d,w,c,v,pk){
  const f=cl((v-w.min)/(w.max-w.min),0,1),sv=d.querySelector('svg'),n=(sv&&sv.dataset.n?sv.dataset.n:'-135,135,50,55').split(',').map(Number);
  const g=d.querySelector('.gv');
  if(g){if(g.dataset.p){const a=g.dataset.p.split(',');g.innerHTML=seg7(v.toFixed(c.d),+a[0],+a[1],+a[2],+a[3],a[4],+a[5])}else g.textContent=v.toFixed(c.d)}
  const nd=d.querySelector('.nd');if(nd)nd.setAttribute('transform','rotate('+(n[0]+(n[1]-n[0])*f)+' '+n[2]+' '+n[3]+')');
  const sg=d.querySelectorAll('.sg');if(sg.length){const k=Math.round(f*sg.length);sg.forEach((e,i)=>{const o=i<k;e.setAttribute('stroke-opacity',o?1:.14);e.setAttribute('fill-opacity',o?1:.14);e.classList.toggle('lit',o)})}
}
function thPanel(){
  const T=[['l','LED τόξο'],['c','Κλασικό με βελόνα'],['e','Ψηφιακό LCD'],['s','Απλό']],cur=S.theme||'l';
  D('<h3>Θέμα οργάνων</h3><div>'+T.map(t=>'<button data-th="'+t[0]+'"'+(cur===t[0]?' style="border-color:#fff"':'')+'>'+t[1]+'</button>').join(' ')+'</div>'
   +'<div style="display:flex;gap:16px;align-items:center;margin:10px 0"><div id="pvw" style="width:130px;height:130px;flex:none"></div><div style="flex:1">'
   +'<label>Κύριο χρώμα<input type="color" id="t_1" value="'+(S.c1||'#ff2d2d')+'" style="width:56px;padding:2px"></label>'
   +'<label>Χρώμα κλίμακας<input type="color" id="t_2" value="'+(S.c2||'#ffffff')+'" style="width:56px;padding:2px"></label></div></div><button id="f_x">Κλείσιμο</button>');
  const w={k:'boost',min:-1,max:2};$('#pvw').innerHTML=gsvg(w,cur);gupd($('#pvw'),w,M.boost,1.2,1.6);
  $('#dlg').querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();build();thPanel()});
  $('#t_1').oninput=e=>{S.c1=e.target.value;applyBg()};$('#t_1').onchange=save;
  $('#t_2').oninput=e=>{S.c2=e.target.value;applyBg()};$('#t_2').onchange=save;
  $('#f_x').onclick=closeD;
}
function build(){
  const st=$('#stage'),pg=S.pages[S.cur];st.innerHTML='';refs.clear();
  st.classList.toggle('ed',edit);$('#pn').textContent=pg.n;
  $('#st').textContent=edit?'Σύρε · τράβα τη γωνία · πάτα για ρυθμίσεις':(demo?'Demo':$('#st').dataset.l||'');
  if(!pg.w.length&&!S.orient){const e=document.createElement('div');e.id='empty';e.style.flexDirection='column';e.style.gap='14px';
    e.innerHTML='<div>Πώς θες να χρησιμοποιείς την εφαρμογή;</div><button data-o="l">Οριζόντια (landscape)</button><button data-o="p">Κάθετη (portrait)</button>';
    e.onclick=ev=>{const o=ev.target.dataset.o;if(o){S.orient=o;save();fit();build()}};st.appendChild(e);return}
  if(!pg.w.length){const e=document.createElement('div');e.id='empty';e.textContent='Let’s start config your layout';
    e.onclick=()=>{edit=true;build();dlgW({t:'b',k:'rpm'},true)};st.appendChild(e);return}
  pg.w.forEach(w=>st.appendChild(mk(w)));
}
function drag(e,w,d){
  if(!edit)return;
  const r=$('#stage').getBoundingClientRect(),rz=e.target.classList.contains('rz');
  const sx=e.clientX,sy=e.clientY,o={...w};let mv=false;d.setPointerCapture(e.pointerId);
  const m=ev=>{
    if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>6)mv=true;
    const dx=rot?(ev.clientY-sy)/r.height*100:(ev.clientX-sx)/r.width*100,dy=rot?-(ev.clientX-sx)/r.width*100:(ev.clientY-sy)/r.height*100;
    if(rz){w.w=cl(sn(o.w+dx),10,100-w.x);w.h=cl(sn(o.h+dy),10,100-w.y)}
    else{w.x=cl(sn(o.x+dx),0,100-w.w);w.y=cl(sn(o.y+dy),0,100-w.h)}
    pos(d,w)};
  const u=()=>{d.removeEventListener('pointermove',m);d.removeEventListener('pointerup',u);d.removeEventListener('pointercancel',u);save();if(!mv&&!rz)dlgW(w,false)};
  d.addEventListener('pointermove',m);d.addEventListener('pointerup',u);d.addEventListener('pointercancel',u);
}
setInterval(()=>{
  if(demo)sim();
  for(const w of S.pages[S.cur].w){
    const d=refs.get(w);if(!d)continue;const c=M[w.k],v=val(c);if(v==null)continue;
    const m=mm[c.k]||(mm[c.k]={a:v,b:v});m.a=Math.min(m.a,v);m.b=Math.max(m.b,v);
    let al=(on(w.hi)&&v>w.hi)||(on(w.lo)&&v<w.lo);
    if(c.k==='afr'&&on(S.lean)&&val(M.boost)>.2&&v>S.lean)al=true;
    d.classList.toggle('al',al);
    if(w.t==='g')gupd(d,w,c,v,m.b);
    else{d.querySelector('.bv').textContent=v.toFixed(c.d);const b=d.querySelectorAll('.bm b');b[0].textContent=m.a.toFixed(c.d);b[1].textContent=m.b.toFixed(c.d)}
  }
  const r=val(M.rpm);document.body.style.setProperty('--sl',S.col);
  document.body.classList.toggle('flash',on(S.shift)&&r!=null&&r>=S.shift);
  if(cal){for(const c of DEF){const e=$('#r_'+c.k),id=get(c,'id');if(e)e.textContent=id!=null&&raw[id]!==undefined?raw[id]:'-'}
    const a=$('#all');if(a)a.textContent=Object.keys(raw).map(Number).sort((x,y)=>x-y).map(k=>hx(k)+'='+raw[k]).join('  ')}
},100);
function sim(){const t=Date.now()/1000,w=Math.sin(t/2);
  raw[1]=Math.round(3500+3000*w);raw[2]=Math.round(100+80*Math.max(0,w));raw[3]=Math.round(40+40*w);
  raw[4]=46;raw[5]=504;raw[6]=77;raw[0x10]=Math.round(125+20*Math.sin(t))}

// Παράθυρο ρυθμίσεων οργάνου
const D=h=>{$('#dlg').innerHTML=h;$('#dlg').classList.add('open')};
const closeD=()=>{$('#dlg').classList.remove('open');cal=false};
function dlgW(w,isNew){
  const o=DEF.map(c=>`<option value="${c.k}"${c.k===w.k?' selected':''}>${c.n}</option>`).join('');
  const c0=M[w.k];
  D(`<h3>${isNew?'Νέο όργανο':'Όργανο'}</h3>
  <label>Τύπος<select id="f_t"><option value="b"${w.t==='b'?' selected':''}>Κουτάκι</option><option value="g"${w.t==='g'?' selected':''}>Αναλογικό</option></select></label>
  <label>Κανάλι<select id="f_k">${o}</select></label>
  <label>Συναγερμός κάτω από<input id="f_lo" value="${w.lo??''}"></label>
  <label>Συναγερμός πάνω από<input id="f_hi" value="${w.hi??''}"></label>
  <label>Κλίμακα αναλογικού, από<input id="f_min" value="${w.min??c0.min}"></label>
  <label>Κλίμακα αναλογικού, έως<input id="f_max" value="${w.max??c0.max}"></label>
  <div><button id="f_ok">Αποθήκευση</button> ${isNew?'':'<button id="f_del">Διαγραφή</button> '}<button id="f_x">Κλείσιμο</button></div>`);
  $('#f_k').onchange=()=>{const c=M[$('#f_k').value];$('#f_min').value=c.min;$('#f_max').value=c.max};
  $('#f_x').onclick=closeD;
  if(!isNew)$('#f_del').onclick=()=>{const a=S.pages[S.cur].w;a.splice(a.indexOf(w),1);save();closeD();build()};
  $('#f_ok').onclick=()=>{
    const g=i=>{const v=$(i).value.trim();return v===''?null:Number(v)};
    w.t=$('#f_t').value;w.k=$('#f_k').value;w.lo=g('#f_lo');w.hi=g('#f_hi');
    w.min=g('#f_min')??M[w.k].min;w.max=g('#f_max')??M[w.k].max;
    if(isNew){const a=S.pages[S.cur].w,n=a.length%6;Object.assign(w,w.t==='g'?{x:4+n*4,y:4+n*4,w:40,h:52}:{x:4+n*4,y:4+n*4,w:38,h:28});a.push(w)}
    save();closeD();build();
  };
}
// Βαθμονόμηση καναλιών
function panel(){
  let h=`<h3>Βαθμονόμηση</h3><div class="h">ID σε hex όπως στην αναφορά. Τιμή = ωμή × (πολλαπλ.) + (σταθερά).</div><div style="overflow-x:auto"><table><tr><th>Κανάλι<th>ID<th>×<th>+<th>Ωμή</tr>`;
  for(const c of DEF){if(c.k==='boost')continue;const id=get(c,'id');
    h+=`<tr><td>${c.n}<td><input data-k="${c.k}" data-f="id" value="${id==null?'':hx(id)}" style="width:52px"><td><input data-k="${c.k}" data-f="s" value="${get(c,'s')}" style="width:62px"><td><input data-k="${c.k}" data-f="o" value="${get(c,'o')}" style="width:52px"><td id="r_${c.k}"></tr>`}
  h+=`</table></div><label>Ατμοσφαιρική πίεση (kPa) για το boost<input data-g="baro" value="${S.baro}"></label>
  <label>Shift light στις στροφές<input data-g="shift" value="${S.shift??''}"></label>
  <label>Χρώμα shift light<input type="color" data-g="col" value="${S.col}" style="width:56px;padding:2px"></label>
  <label>Συναγερμός AFR πάνω από (μόνο με boost &gt; 0.2 bar)<input data-g="lean" value="${S.lean??''}"></label>
  <div class="h">Όλα τα ID (ωμές): <span id="all"></span></div><button id="f_x">Κλείσιμο</button>`;
  D(h);cal=true;$('#f_x').onclick=closeD;
}
$('#dlg').addEventListener('change',e=>{
  const i=e.target,k=i.dataset.k,f=i.dataset.f,g=i.dataset.g,v=i.value.trim();
  if(g)S[g]=g==='col'?v:(v===''?null:Number(v));
  else if(k)(S.ch[k]=S.ch[k]||{})[f]=v===''?null:(f==='id'?parseInt(v,16):Number(v));
  else return;
  save();
});

function applyBg(){
  document.documentElement.style.setProperty('--c1',S.c1||'#ff2d2d');document.documentElement.style.setProperty('--c2',S.c2||'#ffffff');
  $('#bgl').style.background=S.bgi?'linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url('+S.bgi+') center/cover no-repeat':(S.bgc||'#000');
  const l=$('#logo');l.style.display=S.logo===false?'none':'flex';l.style.opacity=S.lop??0.1;
  l.innerHTML=S.logoi?'<img src="'+S.logoi+'" style="max-width:62%;max-height:70%">':LOGO;
}
function img(f,max,fmt,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/'+fmt,.82))};i.src=r.result};r.readAsDataURL(f)}
function bgPanel(){
  const sw=['#000000','#141414','#08121f','#160a0a','#0b140b'].map(c=>'<button data-c="'+c+'" style="background:'+c+';width:44px;height:44px;padding:0"></button>').join(' ');
  D(`<h3>Φόντο</h3><div>${sw} <input type="color" id="b_c" value="${S.bgc||'#000000'}" style="width:56px;padding:2px"></div>
  <label>Φωτογραφία φόντου<input type="file" id="b_i" accept="image/*" style="width:190px"></label><button id="b_ri">Αφαίρεση φωτογραφίας</button>
  <h3 style="margin-top:14px">Logo</h3>
  <label>Εμφάνιση<input type="checkbox" id="l_s"${S.logo!==false?' checked':''} style="width:auto"></label>
  <label>Ένταση<input type="range" id="l_o" min="0" max="30" value="${Math.round((S.lop??.1)*100)}" style="width:150px"></label>
  <label>Δικό σου logo<input type="file" id="l_i" accept="image/*" style="width:190px"></label>
  <div><button id="l_r">Επαναφορά logo</button> <button id="f_x">Κλείσιμο</button></div>`);
  $('#dlg').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.bgc=b.dataset.c;S.bgi=null;save();applyBg()});
  $('#b_c').onchange=e=>{S.bgc=e.target.value;S.bgi=null;save();applyBg()};
  $('#b_i').onchange=e=>img(e.target.files[0],1280,'jpeg',u=>{S.bgi=u;if(!save()){S.bgi=null;alert('Η φωτογραφία δεν χωράει στη μνήμη. Δοκίμασε μικρότερη.')}applyBg()});
  $('#b_ri').onclick=()=>{S.bgi=null;save();applyBg()};
  $('#l_s').onchange=e=>{S.logo=e.target.checked;save();applyBg()};
  $('#l_o').oninput=e=>{S.lop=e.target.value/100;applyBg()};$('#l_o').onchange=()=>save();
  $('#l_i').onchange=e=>img(e.target.files[0],600,'png',u=>{S.logoi=u;if(!save()){S.logoi=null;alert('Το logo δεν χωράει στη μνήμη.')}applyBg()});
  $('#l_r').onclick=()=>{S.logoi=null;save();applyBg()};
  $('#f_x').onclick=closeD;
}

// Bluetooth, μόνο ανάγνωση (FFE1 notify)
function parse(){while(buf.length>=5){
  if(buf[1]===0xA3&&((buf[0]+buf[1]+buf[2]+buf[3])&255)===buf[4]){raw[buf[0]]=(buf[2]<<8)|buf[3];buf.splice(0,5)}else buf.shift()}}
async function connect(){
  if(!navigator.bluetooth){$('#st').textContent='Άνοιξε τη σελίδα στο Bluefy';return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'EMU'}],optionalServices:[0xffe0]});
    dev.addEventListener('gattserverdisconnected',()=>{$('#st').dataset.l='Αποσυνδέθηκε';$('#st').textContent='Αποσυνδέθηκε'});
    const s=await dev.gatt.connect(),sv=await s.getPrimaryService(0xffe0),ch=await sv.getCharacteristic(0xffe1);
    ch.addEventListener('characteristicvaluechanged',e=>{const d=e.target.value;for(let i=0;i<d.byteLength;i++)buf.push(d.getUint8(i));parse()});
    await ch.startNotifications();
    demo=false;for(const k in raw)delete raw[k];for(const k in mm)delete mm[k];
    $('#st').dataset.l='Live: '+(dev.name||'');$('#st').textContent=$('#st').dataset.l;
    try{await navigator.wakeLock.request('screen')}catch(e){}
  }catch(e){$('#st').textContent='Σφάλμα: '+e.message}
}

function menu(){
  const pg=S.pages.map((p,i)=>`<button data-p="${i}"${i===S.cur?' style="border-color:var(--ac)"':''}>${p.n}</button>`).join('');
  $('#mn').innerHTML=`<button data-a="c">Σύνδεση EMUBT</button><button data-a="d">Demo: ${demo?'ΝΑΙ':'ΟΧΙ'}</button>
  <div class="s">LAYOUT</div><button data-a="e">✎ Επεξεργασία: ${edit?'ΝΑΙ':'ΟΧΙ'}</button><button data-a="a">＋ Νέο όργανο</button>
  <div class="s">ΣΕΛΙΔΕΣ</div>${pg}<button data-a="np">＋ Νέα σελίδα</button><button data-a="rn">Μετονομασία σελίδας</button><button data-a="dp">Διαγραφή σελίδας</button>
  <div class="s">ΑΛΛΑ</div><button data-a="t">🎨 Θέμα οργάνων</button><button data-a="b">🖼 Φόντο και logo</button><button data-a="o">Προσανατολισμός: ${S.orient==='p'?'Κάθετη':'Οριζόντια'}</button><button data-a="k">⚙ Βαθμονόμηση, Shift light</button><button data-a="r">Επαναφορά όλων</button>`;
}
$('#hb').onclick=()=>{menu();$('#mn').classList.toggle('open')};
$('#stage').addEventListener('pointerdown',()=>$('#mn').classList.remove('open'));
$('#mn').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p!=null){S.cur=+b.dataset.p;save();build();menu();return}
  const a=b.dataset.a,cm=()=>$('#mn').classList.remove('open');
  if(a==='c'){cm();connect()}
  else if(a==='d'){demo=!demo;build();menu()}
  else if(a==='e'){edit=!edit;build();menu();cm()}
  else if(a==='a'){cm();edit=true;build();dlgW({t:'b',k:'rpm'},true)}
  else if(a==='np'){S.pages.push({n:'Σελίδα '+(S.pages.length+1),w:[]});S.cur=S.pages.length-1;save();build();menu()}
  else if(a==='rn'){const n=prompt('Όνομα σελίδας',S.pages[S.cur].n);if(n){S.pages[S.cur].n=n;save();build();menu()}}
  else if(a==='dp'){if(S.pages.length>1&&confirm('Διαγραφή σελίδας;')){S.pages.splice(S.cur,1);S.cur=0;save();build();menu()}}
  else if(a==='o'){S.orient=S.orient==='p'?'l':'p';save();fit();build();menu()}
  else if(a==='t'){cm();thPanel()}
  else if(a==='b'){cm();bgPanel()}
  else if(a==='k'){cm();panel()}
  else if(a==='r'){if(confirm('Διαγραφή όλων των ρυθμίσεων και των οργάνων;')){try{localStorage.removeItem('emudash2')}catch(e){}location.reload()}}
});
$('#pv').onclick=()=>{S.cur=(S.cur+S.pages.length-1)%S.pages.length;save();build()};

function splash(){
  const e=$('#splash');
  if(S.logo===false){e.remove();return}
  const go=()=>{e.classList.add('out');setTimeout(()=>e.remove(),800)};e.onclick=go;
  if(S.logoi){e.innerHTML='<img src="'+S.logoi+'" style="max-width:80%;max-height:80%">';setTimeout(go,2200);return}
  const k=Math.min(.8*e.offsetWidth/SPL.w,.8*e.offsetHeight/SPL.h);
  e.innerHTML='<svg width="'+SPL.w*k+'" height="'+SPL.h*k+'" viewBox="0 0 '+SPL.w+' '+SPL.h+'"><image href="'+SPL.img+'" width="'+SPL.w+'" height="'+SPL.h+'"/><g id="sn" fill="#ff1e1e"><polygon points="347.0,246.4 362.0,246.4 355.9,104.4 353.1,104.4"/><circle cx="'+SPL.x+'" cy="'+SPL.y+'" r="20"/></g></svg>';
  const n=$('#sn'),t0=performance.now();
  (function f(t){
    const u=Math.min(1,Math.max(0,(t-t0-150)/1700)),z=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    n.setAttribute('transform','rotate('+(-96+192*z)+' '+SPL.x+' '+SPL.y+')');
    if(u<1&&document.body.contains(n))requestAnimationFrame(f);
  })(t0);
  setTimeout(go,2300);
}
applyBg();fit();build();splash();
</script>
