:is(#mn,#dlg),:is(#mn,#dlg) :is(button,input,select,textarea,label,.h,.s,small,table,.dylg){font-family:Raela,-apple-system,system-ui,Roboto,sans-serif}
:is(#mn,#dlg),:is(#mn,#dlg) *{font-weight:400!important;font-synthesis:none}
:root{--bg:#000;--card:#0e0e0e;--bd:#2c2c2c;--fg:#f2f2f2;--mut:#8a8a8a;--ac:#f2f2f2;--bad:#ff2d2d;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
html,body{height:100%;margin:0}
body{position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,sans-serif;overflow:hidden}
body.flash,body.flash #bgl{animation:fl .18s steps(1) infinite}
@keyframes fl{0%{background:var(--sl,#f00)}50%{background:var(--bg)}}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{font-weight:600}
#bgl,#logo{position:absolute;inset:0;pointer-events:none}
#splash{position:absolute;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#splash.out{opacity:0;pointer-events:none}
#logo{display:flex;align-items:center;justify-content:center}
#top{position:relative;z-index:1;height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px}
#hb{font-size:24px;border:0;background:none;padding:2px 10px}
#pn{font-weight:600;min-width:70px;text-align:center}
#st{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
#st[data-c=g],#st[data-c=w],#st[data-c=r]{display:inline-flex;align-items:center;gap:6px}
#st[data-c=g]::before,#st[data-c=w]::before,#st[data-c=r]::before{content:'';width:8px;height:8px;border-radius:50%;flex:none;background:#3ad07a;box-shadow:0 0 6px currentColor}
#st[data-c=w]::before{background:#ffb020;animation:stp 1s ease-in-out infinite}
#st[data-c=r]::before{background:#ff3b3b}
@keyframes stp{50%{opacity:.25}}
#stage{flex:1;position:relative;z-index:1;margin:0 6px 6px;overflow:hidden}

function seg7(str,x,y,sx,sy,al,sk){

  for(const ch of str){

function segTxt(str,x,y,sx,sy,al,sk){

    const a=$('#all');if(a)a.textContent=Object.keys(raw).map(Number).sort((x,y)=>x-y).map(k=>hx(k)+'='+raw[k]).join('  ')}
  if(DY.ui)DY.ui();
},100);
function sim(){if(DY.sim)return;const t=Date.now()/1000,w=Math.sin(t/2);
  raw[1]=Math.round(3500+3000*w);raw[2]=Math.round(100+80*Math.max(0,w));raw[3]=Math.round(40+40*w);
  // Demo: μπαταρία ~14.1V με τη μηχανή αναμμένη (μικρές διακυμάνσεις), νερό/IAT κινούνται λίγο, ταχύτητα από τις στροφές
  const bs=get(M.bat,'s')||.027,V=13.9+.3*Math.sin(t/3)+.08*Math.sin(t*2.3);
  raw[5]=Math.round(V/bs);raw[6]=Math.round(86+4*Math.sin(t/9));raw[4]=Math.round(34+10*Math.max(0,w));
  raw[0x10]=Math.round(125+20*Math.sin(t));raw.spd=Math.round(raw[1]*.03)}

const D=h=>{$('#dlg').innerHTML=h;$('#dlg').classList.add('open')};
const closeD=()=>{$('#dlg').classList.remove('open');cal=false};
function dlgW(w,isNew){
  if(w.t==='s'){sdlg(w);return}
  const o=DEF.map(c=>`<option value="${c.k}"${c.k===w.k?' selected':''}>${cn(c)}</option>`).join('');
  const c0=M[w.k],th=thm(),mx=th==='e'?2:th==='l'||th==='a'||th==='f'?1:0,xs=w.xs||[];
  const op=v=>['peak','bat','afr'].map(k=>'<option value="'+k+'"'+(v===k?' selected':'')+'>'+({peak:'Peak',bat:'Μπαταρία (Volt)',afr:'AFR'})[k]+'</option>').join('');
  const xr=mx?'<label id="r_xn">Έξτρα οθόνες<select id="f_xn">'+[...Array(mx+1).keys()].map(i=>'<option value="'+i+'"'+(xs.length===i?' selected':'')+'>'+(i?i:'Όχι')+'</option>').join('')+'</select></label><label id="r_x1">Οθόνη 1<select id="f_x1">'+op(xs[0])+'</select></label><label id="r_x2">Οθόνη 2<select id="f_x2">'+op(xs[1])+'</select></label>':'';
  D(`<h3>${isNew?'Νέο όργανο':'Όργανο'}</h3>
  <label>Τύπος<select id="f_t"><option value="b"${w.t==='b'?' selected':''}>Κουτάκι</option><option value="g"${w.t==='g'?' selected':''}>Αναλογικό</option><option value="r"${w.t==='r'?' selected':''}>Μπάρα</option></select></label>
  <label>Κανάλι<select id="f_k">${o}<option value="clk"${w.k==='clk'?' selected':''}>Ρολόι (ώρα)</option></select></label>
  <label>Συναγερμός κάτω από<span><input id="f_lo" value="${w.lo??''}" style="width:72px"> <input type="color" id="f_lc" value="${w.lc||'#2d7bff'}" style="width:44px;padding:2px"></span></label>
  <label>Συναγερμός πάνω από<span><input id="f_hi" value="${w.hi??''}" style="width:72px"> <input type="color" id="f_hc" value="${w.hc||'#ff2d2d'}" style="width:44px;padding:2px"></span></label>
  <label id="r_min">Κλίμακα αναλογικού, από<input id="f_min" value="${w.min??dmin(c0)}"></label>
  <label id="r_max">Κλίμακα αναλογικού, έως<input id="f_max" value="${w.max??dmax(c0)}"></label>${xr}
  ${th==='f'?'<label class="rg">Χρώμα φόντου οργάνου<input type="color" id="f_fc" value="'+(w.fc||'#05070a')+'" style="width:56px;padding:2px"></label>':''}${th==='a'||th==='f'?'<label class="rg">Χωρίς φόντο (διάφανο)<input type="checkbox" id="f_nf"'+(w.nf?' checked':'')+' style="width:auto"></label>':''}
  ${th==='l'||th==='e'?'<label class="rg">Περίγραμμα οργάνου (στεφάνι και μαύρο φόντο)<input type="checkbox" id="f_nb"'+(w.nb?'':' checked')+' style="width:auto"></label>':''}
  <label class="rg">Χρώμα γραμμάτων<input type="color" id="f_tc" value="${w.tc||'#ffffff'}" style="width:56px;padding:2px"></label>
  <label class="rg">Χρώμα τόξου<input type="color" id="f_ac" value="${w.ac||S.c1||'#ff2d2d'}" style="width:56px;padding:2px"></label>
  <label class="rg">Χρώμα τέλους τόξου<input type="color" id="f_ec" value="${w.ec||w.ac||S.c1||'#ff2d2d'}" style="width:56px;padding:2px"></label>
  <label class="rg">Τέλος τόξου από (%) (100 = όχι)<input id="f_ep" value="${w.ep??100}"></label>
  <label class="rb">Εμφάνιση επικεφαλίδας<input type="checkbox" id="f_nh"${w.nh?'':' checked'} style="width:auto"></label>
  <label class="rb">Εμφάνιση Min / Max<input type="checkbox" id="f_mm"${w.nm?'':' checked'} style="width:auto"></label>
  <label class="rb">Χρώμα τιμής<input type="color" id="f_vc" value="${w.vc||'#f2f2f2'}" style="width:56px;padding:2px"></label>
  <label class="rb">Χρώμα περιφερειακών γραμμάτων (IAT, Min, Max)<input type="color" id="f_pc" value="${w.pc||'#8a8a8a'}" style="width:56px;padding:2px"></label>
  <div><button id="f_ok">Αποθήκευση</button> ${isNew?'':'<button id="f_del">Διαγραφή</button> '}<button id="f_x">Κλείσιμο</button></div>`);
  const syncT=()=>{const ty=$('#f_t').value;let g=ty==='g'||ty==='r';const ck=$('#f_k').querySelector('option[value="clk"]');ck.hidden=g;if(g&&$('#f_k').value==='clk'){$('#f_k').value='rpm';$('#f_k').onchange&&$('#f_k').onchange()}
    ['r_min','r_max'].forEach(i=>$('#'+i).style.display=g?'':'none');
    document.querySelectorAll('#dlg .rg').forEach(e=>e.style.display=g?'':'none');
    if(th==='a')['#f_ac','#f_ec','#f_ep'].forEach(i=>$(i).closest('label').style.display='none'); // Αναλογικό: όλα από το χρώμα γραμμάτων
    document.querySelectorAll('#dlg .rb').forEach(e=>e.style.display=g?'none':'');
    ['#f_lo','#f_hi'].forEach(i=>$(i).closest('label').style.display='');
    if($('#f_k').value==='clk')['#f_nh','#f_mm','#f_lo','#f_hi','#f_pc'].forEach(i=>$(i).closest('label').style.display='none'); // ρολόι: χωρίς επικεφαλίδα, Min/Max, συναγερμούς, δεύτερο χρώμα
    if(mx){const gg=ty==='g';$('#r_xn').style.display=gg?'':'none';const n=+$('#f_xn').value;$('#r_x1').style.display=gg&&n>=1?'':'none';$('#r_x2').style.display=gg&&n>=2?'':'none'}
    if(ty==='r'&&$('#f_nb')&&th!=='e')$('#f_nb').closest('label').style.display='none'; // μπάρα: περίγραμμα μόνο στο LCD (το πλαίσιο της οθόνης)
    };
  $('#f_t').onchange=syncT;if(mx)$('#f_xn').onchange=syncT;syncT();
  $('#f_k').onchange=()=>{const c=M[$('#f_k').value];$('#f_min').value=dmin(c);$('#f_max').value=dmax(c);syncT()};syncT();
  $('#f_x').onclick=closeD;
  if(!isNew)$('#f_del').onclick=()=>{const a=S.pages[S.cur].w;a.splice(a.indexOf(w),1);save();closeD();build()};
  $('#f_ok').onclick=()=>{
    const g=i=>{const v=$(i).value.trim();return v===''?null:Number(v)};
    w.t=$('#f_t').value;w.k=$('#f_k').value;w.lo=g('#f_lo');w.hi=g('#f_hi');w.lc=$('#f_lc').value;w.hc=$('#f_hc').value;
    if($('#f_nb'))w.nb=$('#f_nb').checked?undefined:true;if($('#f_fc')){const v=$('#f_fc').value.toLowerCase();w.fc=v==='#05070a'?undefined:v}if($('#f_nf'))w.nf=$('#f_nf').checked||undefined;w.tc=$('#f_tc').value;w.ac=$('#f_ac').value;w.ec=$('#f_ec').value;w.ep=g('#f_ep')??100;
    w.nm=$('#f_mm').checked?undefined:true;w.nh=$('#f_nh').checked?undefined:true;if(w.k==='clk')w.t='b';w.vc=$('#f_vc').value==='#f2f2f2'?undefined:$('#f_vc').value;w.pc=$('#f_pc').value==='#8a8a8a'?undefined:$('#f_pc').value;if(mx){const n=+$('#f_xn').value;w.xs=[$('#f_x1').value,$('#f_x2').value].slice(0,n)}
    w.min=g('#f_min')??dmin(M[w.k]);w.max=g('#f_max')??dmax(M[w.k]);
    if(isNew){const a=S.pages[S.cur].w,n=a.length%6;Object.assign(w,w.t==='g'?{x:4+n*4,y:4+n*4,w:40,h:52}:w.t==='r'?{x:4+n*4,y:4+n*4,w:70,h:24}:{x:4+n*4,y:4+n*4,w:38,h:28});a.push(w)}
    save();closeD();build();
  };
}

function applyBg(){
  document.documentElement.style.setProperty('--c1',S.c1||'#ff2d2d');document.documentElement.style.setProperty('--c2',S.c2||'#ffffff');
  $('#bgl').style.background=S.bgi?'linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url('+S.bgi+') center/cover no-repeat':(S.bgc||'#000');
  const l=$('#logo');l.style.display=S.logo===false?'none':'flex';l.style.opacity=S.lop??0.16;
  l.innerHTML=S.logoi?'<img src="'+S.logoi+'" style="max-width:62%;max-height:70%">':LOGO;
}
function img(f,max,fmt,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/'+fmt,.82))};i.src=r.result};r.readAsDataURL(f)}
function bgPanel(){
  const sw=['#000000','#141414','#08121f','#160a0a','#0b140b'].map(c=>'<button data-c="'+c+'" style="background:'+c+';width:44px;height:44px;padding:0"></button>').join(' ');
  D(`<h3>Φόντο</h3><div>${sw} <input type="color" id="b_c" value="${S.bgc||'#000000'}" style="width:56px;padding:2px"></div>
  <label>Φωτογραφία φόντου<input type="file" id="b_i" accept="image/*" style="width:190px"></label><button id="b_ri">Αφαίρεση φωτογραφίας</button>
  <h3 style="margin-top:14px">Logo</h3>
  <label>Εμφάνιση<input type="checkbox" id="l_s"${S.logo!==false?' checked':''} style="width:auto"></label>
  <label>Ένταση<input type="range" id="l_o" min="0" max="30" value="${Math.round((S.lop??.16)*100)}" style="width:150px"></label>
  <label>Δικό σου logo<input type="file" id="l_i" accept="image/*" style="width:190px"></label>
  <div><button id="l_r">Επαναφορά logo</button> <button id="f_x">Κλείσιμο</button></div>`);
  $('#dlg').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.bgc=b.dataset.c;S.bgi=null;save();applyBg()});
  $('#b_c').onchange=e=>{S.bgc=e.target.value;S.bgi=null;save();applyBg()};
  $('#b_i').onchange=e=>img(e.target.files[0],1280,'jpeg',u=>{S.bgi=u;if(!save()){S.bgi=null;alert(t('Η φωτογραφία δεν χωράει στη μνήμη. Δοκίμασε μικρότερη.'))}applyBg()});
  $('#b_ri').onclick=()=>{S.bgi=null;save();applyBg()};
  $('#l_s').onchange=e=>{S.logo=e.target.checked;save();applyBg()};
  $('#l_o').oninput=e=>{S.lop=e.target.value/100;applyBg()};$('#l_o').onchange=()=>save();
  $('#l_i').onchange=e=>img(e.target.files[0],600,'png',u=>{S.logoi=u;if(!save()){S.logoi=null;alert(t('Το logo δεν χωράει στη μνήμη.'))}applyBg()});
  $('#l_r').onclick=()=>{S.logoi=null;save();applyBg()};
  $('#f_x').onclick=closeD;
}

// Bluetooth, μόνο ανάγνωση (FFE1 notify)
// Κατάσταση σύνδεσης. s: off | conn | live | re (επανασύνδεση) | lost
const BT={s:'off',name:'',want:false,id:null,dev:null,n:0,fps:0,last:0,tries:0,timer:null,err:'',init:false};
function parse(){while(buf.length>=5){
  if(buf[1]===0xA3&&((buf[0]+buf[1]+buf[2]+buf[3])&255)===buf[4]){const i0=buf[0];raw[i0]=(buf[2]<<8)|buf[3];buf.splice(0,5);BT.n++;BT.last=Date.now();dyS(i0)}else buf.shift()}}
const onData=d=>{for(let i=0;i<d.byteLength;i++)buf.push(d.getUint8(i));parse()};
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&window.BleClient);
const U16=n=>'0000'+n+'-0000-1000-8000-00805f9b34fb',SV=U16('ffe0'),CH=U16('ffe1');
const BTK='emubt_dev'; // αποθηκευμένη συσκευή για αυτόματη σύνδεση (native)
// Ένδειξη πάνω δεξιά: τελεία (πράσινη/πορτοκαλί/κόκκινη) + κείμενο + frames/s
function stSet(){
  const e=$('#st');if(!e)return;let c='',l='';
  if(BT.s==='live'){const st=Date.now()-BT.last>2000;c=st?'w':'g';l=(st?'Χωρίς δεδομένα · ':'Live · ')+BT.name+(st?'':' · '+BT.fps+' fps')}
  else if(BT.s==='conn'){c='w';l='Σύνδεση…'}
  else if(BT.s==='re'){c='w';l='Επανασύνδεση… ('+BT.tries+')'}
  else if(BT.s==='lost'){c='r';l='Αποσυνδέθηκε'}
  else if(BT.err){c='r';l=BT.err}
  e.dataset.l=l;e.dataset.c=(edit||demo)?'':c;
  const x=edit?'Σύρε · τράβα τη γωνία · πάτα για ρυθμίσεις · ✓ αποθήκευση':(demo?'Demo':l);
  if(e.dataset.x!==x){e.dataset.x=x;e.textContent=x}
}
setInterval(()=>{BT.fps=BT.n;BT.n=0;if(BT.s==='live')stSet()},1000);
// Η οθόνη να μένει αναμμένη (στο native το κάνει και το MainActivity)
function keepOn(){try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(BT.want)keepOn()});
function goLive(first){
  if(first){demo=false;for(const k in raw)delete raw[k];for(const k in mm)delete mm[k];build()}
  BT.s='live';BT.tries=0;BT.err='';BT.last=Date.now();stSet();keepOn();
}
function btErr(e){BT.s='off';BT.want=false;const m=String(e&&e.message||e||'');
  BT.err=/cancel/i.test(m)?'':'Σφάλμα: '+m;stSet()}
function onLost(){if(!BT.want||BT.s==='off')return;BT.s='lost';stSet();retry()}
// Αυτόματη επανασύνδεση: κάθε 2, 4, 6… έως 10 δευτερόλεπτα, μέχρι να πατηθεί Αποσύνδεση
function retry(){
  clearTimeout(BT.timer);if(!BT.want)return;BT.tries++;BT.s='re';stSet();
  BT.timer=setTimeout(async()=>{
    if(!BT.want)return;
    try{
      if(isNative()){try{await BleClient.disconnect(BT.id)}catch(e){}await nOpen(BT.id)}
      else await wOpen(BT.dev);
      if(BT.want)goLive(false);
    }catch(e){retry()}
  },Math.min(2000*BT.tries,10000));
}
// Native Android (Capacitor): μόνο notify στο FFE1, ποτέ εγγραφή στο FFE2
async function nOpen(id){await BleClient.connect(id,onLost);await BleClient.startNotifications(id,SV,CH,onData)}
async function connectNative(pick){
  clearTimeout(BT.timer);
  try{
    if(!BT.init){await BleClient.initialize();BT.init=true}
    let id=null,name='';
    if(!pick){try{const j=JSON.parse(localStorage.getItem(BTK)||'null');if(j){id=j.id;name=j.name}}catch(e){}}
    if(!id){
      if(BT.id){BT.want=false;try{await BleClient.disconnect(BT.id)}catch(e){}}
      const dev=await BleClient.requestDevice({namePrefix:'EMU',optionalServices:[SV]});id=dev.deviceId;name=dev.name||''}
    BT.id=id;BT.name=name;BT.want=true;BT.s='conn';stSet();
    try{localStorage.setItem(BTK,JSON.stringify({id,name}))}catch(e){}
    try{await nOpen(id)}catch(e){if(pick)throw e;retry();return} // αυτόματη σύνδεση: συνεχίζει να προσπαθεί
    goLive(true);
  }catch(e){btErr(e)}
}
// Web Bluetooth (Bluefy / iOS)
async function wOpen(dev){
  const s=await dev.gatt.connect(),sv=await s.getPrimaryService(0xffe0),ch=await sv.getCharacteristic(0xffe1);
  ch.oncharacteristicvaluechanged=e=>onData(e.target.value); // ανάθεση, όχι addEventListener: χωρίς διπλά δεδομένα μετά από επανασύνδεση
  await ch.startNotifications();
}
async function connect(){
  if(isNative())return connectNative(true);
  if(!navigator.bluetooth){BT.err='Άνοιξε τη σελίδα στο Bluefy';stSet();return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'EMU'}],optionalServices:[0xffe0]});
    if(BT.dev&&BT.dev!==dev){BT.want=false;try{BT.dev.gatt.disconnect()}catch(e){}}
    clearTimeout(BT.timer);BT.dev=dev;BT.name=dev.name||'';BT.want=true;BT.s='conn';stSet();
    dev.ongattserverdisconnected=()=>{if(BT.dev===dev)onLost()};
    await wOpen(dev);goLive(true);
  }catch(e){btErr(e)}
}
// Αποσύνδεση (π.χ. για να ανοίξει η TunerView): σταματά και την αυτόματη επανασύνδεση
async function disconnect(){
  BT.want=false;clearTimeout(BT.timer);BT.s='off';BT.err='';stSet();
  try{if(isNative()){if(BT.id)await BleClient.disconnect(BT.id)}else if(BT.dev&&BT.dev.gatt.connected)BT.dev.gatt.disconnect()}catch(e){}
}

const carNew=(p)=>Object.assign({id:Date.now()+Math.floor(Math.random()*1000),name:'Νέο αυτοκίνητο'},JSON.parse(JSON.stringify(p||{g:DYC.g.slice()})));
// Προφίλ αυτοκινήτων: S.dyno.cars (λίστα), S.dyno.ac (ενεργό id). Το S.dyno.car δείχνει πάντα στο ενεργό προφίλ.
const dyS0=()=>{
  if(!S.dyno)S.dyno={car:{},runs:[]};const D=S.dyno;
  if(!Array.isArray(D.cars)||!D.cars.length){
    const c=D.car&&D.car.ok?Object.assign(carNew(),D.car,{name:'Το αυτοκίνητό μου'}):carNew(CAR0);
    D.cars=[c];D.ac=c.id}

  if(!c.g)c.g=DYC.g.slice();D.car=c;return D};
const dCar=()=>Object.assign({},DYC,dyS0().car);
const dGears=c=>c.g.map((x,i)=>x>0?i+1:0).filter(Boolean);
const dCirc=c=>Math.PI*(c.rim*25.4+2*c.tw*c.ta/100)/1000*.97; // 0.97: φορτωμένη ακτίνα
const dK=(c,g)=>dCirc(c)/((c.g[(g||c.gear)-1]||1)*c.fd*60); // m/s ανά 1 rpm
const dRho=c=>(S.baro||100)*1000/(287.05*(c.amb+273.15));
const dU=c=>PU[c.pu]||PU.ps;
const esc=x=>String(x).replace(/[&<>"']/g,ch=>'&#'+ch.charCodeAt(0)+';');
const spU=()=>UN().s==='mph'?'mph':'km/h';
const dSp=ms=>fromBase('spd',ms*3.6);
function dPk(p){let P=p[0],Q=p[0];p.forEach(x=>{if(x.p>P.p)P=x;if(x.q>Q.q)Q=x});return{P,Q}}

// Τοπική τετραγωνική παλινδρόμηση: εξομαλυμένες στροφές και ρυθμός μεταβολής (rpm/s)
function lq(s,i,W){
  const t0=s[i].t;let n=0,a1=0,a2=0,a3=0,a4=0,y0=0,y1=0,y2=0;
  const ac=j=>{const x=s[j].t-t0,y=s[j].r,x2=x*x;n++;a1+=x;a2+=x2;a3+=x2*x;a4+=x2*x2;y0+=y;y1+=x*y;y2+=x2*y};
  for(let j=i;j>=0&&t0-s[j].t<=W;j--)ac(j);
  for(let j=i+1;j<s.length&&s[j].t-t0<=W;j++)ac(j);
  if(n<5)return null;
  const d3=(a,b,c,d,e,f,g,h,k)=>a*(e*k-f*h)-b*(d*k-f*g)+c*(d*h-e*g);
  const D=d3(n,a1,a2,a1,a2,a3,a2,a3,a4);if(Math.abs(D)<1e-12)return null;
  return{r:d3(y0,a1,a2,y1,a2,a3,y2,a3,a4)/D,d:d3(n,y0,a2,a1,y1,a3,a2,y2,a4)/D};
}

function dyCalc(s0,c){
  if(s0.length<12)return{err:'Πολύ λίγα δεδομένα. Ξαναδοκίμασε με πιο μεγάλο τράβηγμα.'};
  let iM=0;s0.forEach((x,i)=>{if(x.r>s0[iM].r)iM=i});
  let i0=0;for(let i=0;i<=iM;i++)if(s0[i].r<=s0[i0].r)i0=i;
  const s=s0.slice(i0,iM+1);
  if(s.length<10||s[s.length-1].r-s[0].r<1200)return{err:'Το εύρος στροφών ήταν μικρό. Ξεκίνα από χαμηλότερες στροφές και κράτα τέρμα μέχρι τον κόφτη.'};
  const T0=s[0].t,T1=s[s.length-1].t;
  if(T1-T0<1)return{err:'Η μέτρηση ήταν πολύ σύντομη. Χρησιμοποίησε μεγαλύτερη ταχύτητα (π.χ. 3η ή 4η).'};
  const k=dK(c),gr=c.g[c.gear-1]*c.fd,me=c.m*(1.04+.0025*gr*gr),rho=dRho(c),W=Math.max(.25,Math.min(.6,(T1-T0)/12)),B={};
  s.forEach((x,i)=>{
    if(x.t-T0<W*.5||T1-x.t<W*.5)return;
    const f=lq(s,i,W);if(!f||f.d<50)return;
    const v=f.r*k,a=f.d*k,Pw=me*a*v+.5*rho*c.cd*c.fa*v*v*v+c.crr*c.m*9.81*v;
    const b=Math.round(f.r/100)*100,o=B[b]||(B[b]={n:0,w:0,a:0,an:0,b:0,bn:0});
    o.n++;o.w+=Pw;if(x.a!=null){o.a+=x.a;o.an++}if(x.b!=null){o.b+=x.b;o.bn++}
  });
  let pts=Object.keys(B).map(Number).sort((a,b)=>a-b).map(r=>{const o=B[r];return{r,w:o.w/o.n,a:o.an?o.a/o.an:null,b:o.bn?o.b/o.bn:null}});
  if(pts.length<5)return{err:'Δεν βρέθηκε καθαρό τράβηγμα. Κράτα γκάζι τέρμα σε μία ταχύτητα χωρίς να πατάς συμπλέκτη.'};
  const K=[1,2,3,2,1];
  pts=pts.map((p,i)=>{let sw=0,sx=0;K.forEach((kk,j)=>{const q=pts[i+j-2];if(q&&Math.abs(q.r-p.r)<=250){sw+=kk;sx+=kk*q.w}});return Object.assign({},p,{w:sx/sw})});
  const lf=1-c.loss/100;
  pts.forEach(p=>{p.p=p.w/lf;p.q=p.p/(p.r*Math.PI/30)});
  return{pts};
}

// Καταγραφή: καλείται για κάθε πλαίσιο που φτάνει από τον EMU
function dyS(id){
  if((DY.st!=='armed'&&DY.st!=='rec')||id!==get(M.rpm,'id'))return;
  const r=bv(M.rpm),p=bv(M.tps),t=performance.now()/1000,c=dCar();
  if(r==null)return;
  if(DY.st==='armed'){if(r<700||(p!=null&&p<c.tps))return;DY.st='rec';DY.s=[];DY.mx=r;DY.mn=r;DY.mt=t}
  DY.s.push({t,r,p,a:bv(M.afr),b:bv(M.boost)});
  if(r>DY.mx+20){DY.mx=r;DY.mt=t}
  if(r<DY.mn)DY.mn=r;
  const dur=t-DY.s[0].t,pulled=DY.mx-DY.mn>800;
  if(dur>40||(dur>.6&&((p!=null&&p<c.tps-20)||(pulled&&(r<DY.mx-350||t-DY.mt>1.2)))))dyEnd();
}
function dyEnd(){dyStopSim();DY.st='done';DY.res=dyCalc(DY.s,dCar());dyShowRes()}
function dyStopSim(){if(DY.sim){clearInterval(DY.sim);DY.sim=null}}
function dyLeave(){dyStopSim();DY.st='idle';DY.ui=null;DY.redraw=null}

// Demo: προσομοίωση τραβήγματος με γνωστή καμπύλη ροπής (165 Nm @ 4800)
function dySimStart(){
  dyStopSim();
  const c=dCar(),k=dK(c),gr=c.g[c.gear-1]*c.fd,me=c.m*(1.04+.0025*gr*gr),rho=dRho(c),rw=dCirc(c)/(2*Math.PI),lim=(S.rpmMax||7200)-100;
  const tq=r=>r<1000?40:165*(1-Math.pow((r-4800)/5200,2));
  const setV=(ch,v)=>{const id=get(ch,'id');if(id!=null)raw[id]=Math.round((v-get(ch,'o'))/get(ch,'s'))};
  let rpm=1800,ph=0,te=0;const t0=performance.now();let last=t0;
  DY.sim=setInterval(()=>{
    const now=performance.now(),el=(now-t0)/1000;let dt=Math.min(.1,(now-last)/1000);last=now;
    if(ph===0&&el>.8)ph=1;
    let tps=4;
    if(ph===1){tps=100;while(dt>0){const h=Math.min(dt,.005),v=rpm*k,F=tq(rpm)*gr*(1-c.loss/100)/rw-.5*rho*c.cd*c.fa*v*v-c.crr*c.m*9.81;rpm=(v+F/me*h)/k;dt-=h}
      if(rpm>=lim){ph=2;te=el}}
    else if(ph===2){tps=0;rpm=Math.max(1500,rpm-2500*dt);if(el-te>2)dyStopSim()}
    setV(M.rpm,rpm+(Math.random()-.5)*10);setV(M.tps,tps);setV(M.map,tps>50?185:35);setV(M.afr,tps>50?11.8+Math.random()*.3:14.7);
    dyS(get(M.rpm,'id'));
  },20);
}

// Γράφημα ισχύος / ροπής
function dyChart(cv,runs,cur,pu){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const all=runs.flatMap(x=>x.pts);if(!all.length)return;
  const L=42,Rm=42,T=12,Bm=24,pw=W-L-Rm,ph=H-T-Bm,u=PU[pu]||PU.ps;
  const r0=Math.floor(Math.min(...all.map(p=>p.r))/500)*500;let r1=Math.ceil(Math.max(...all.map(p=>p.r))/500)*500;if(r1<=r0)r1=r0+500;
  const pm=Math.max(...all.map(p=>p.p/u[1]))*1.12||1,qm=Math.max(...all.map(p=>p.q))*1.12||1;
  const X=r=>L+(r-r0)/(r1-r0)*pw,YP=v=>T+ph-v/pm*ph,YQ=v=>T+ph-v/qm*ph;
  cv._r=x=>cl(r0+(x-L)/pw*(r1-r0),r0,r1);
  g.font='11px -apple-system,system-ui,sans-serif';g.lineWidth=1;g.strokeStyle='#2a2a2a';g.fillStyle='#8a8a8a';
  g.textAlign='right';g.textBaseline='middle';
  lbls(0,pm).forEach(v=>{const y=YP(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillText(v,L-6,y)});
  g.textAlign='left';lbls(0,qm).forEach(v=>g.fillText(v,L+pw+6,YQ(v)));
  g.textAlign='center';g.textBaseline='top';const stp=(r1-r0)>4000?1000:500;
  for(let r=r0;r<=r1;r+=stp){const x=X(r);g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.fillText(r,x,T+ph+6)}
  const line=(pts,f,col,w,dash,al)=>{g.save();g.strokeStyle=col;g.globalAlpha=al||1;g.lineWidth=w;g.setLineDash(dash||[]);g.lineJoin='round';g.beginPath();pts.forEach((p,i)=>{const x=X(p.r),y=f(p);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.restore()};
  runs.forEach(x=>{
    if(runs.length===1)line(x.pts,p=>YP(p.w/u[1]),x.col,1.5,[],.45);
    line(x.pts,p=>YP(p.p/u[1]),x.col,2.6);
    line(x.pts,p=>YQ(p.q),runs.length===1?'#f2f2f2':x.col,2,[6,4]);
  });
  if(cur!=null){const x=X(cur);g.save();g.strokeStyle='#fff';g.globalAlpha=.6;g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.restore()}
}
// Γράφημα AFR (και boost αν υπάρχει)
function dyChart2(cv,runs,cur){
  const all=runs.flatMap(x=>x.pts),A=all.filter(p=>p.a!=null).map(p=>p.a),Bs=all.filter(p=>p.b!=null).map(p=>fromBase('boost',p.b));
  if(!A.length){cv.style.display='none';return}cv.style.display='';
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const L=42,Rm=42,T=8,Bm=8,pw=W-L-Rm,ph=H-T-Bm;
  const r0=Math.floor(Math.min(...all.map(p=>p.r))/500)*500;let r1=Math.ceil(Math.max(...all.map(p=>p.r))/500)*500;if(r1<=r0)r1=r0+500;
  let a0=Math.floor(Math.min(...A)-.5),a1=Math.ceil(Math.max(...A)+.5);
  const hb=Bs.length&&Math.max(...Bs)>0.05,b0=hb?Math.min(0,...Bs):0,b1=hb?Math.max(...Bs)*1.15:1;
  const X=r=>L+(r-r0)/(r1-r0)*pw,YA=v=>T+ph-(v-a0)/(a1-a0)*ph,YB=v=>T+ph-(v-b0)/(b1-b0)*ph;
  g.font='11px -apple-system,system-ui,sans-serif';g.lineWidth=1;g.strokeStyle='#2a2a2a';g.fillStyle='#8a8a8a';g.textBaseline='middle';
  g.textAlign='right';lbls(a0,a1).forEach(v=>{const y=YA(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillText(v,L-6,y)});
  if(hb){g.textAlign='left';lbls(b0,b1).forEach(v=>g.fillText(v,L+pw+6,YB(v)))}
  const line=(pts,f,col,w,dash)=>{g.save();g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();let st=false;pts.forEach(p=>{const y=f(p);if(y==null){st=false;return}const x=X(p.r);st?g.lineTo(x,y):g.moveTo(x,y);st=true});g.stroke();g.restore()};
  runs.forEach(x=>{
    line(x.pts,p=>p.a==null?null:YA(p.a),runs.length===1?'#ffb020':x.col,2);
    if(hb)line(x.pts,p=>p.b==null?null:YB(fromBase('boost',p.b)),runs.length===1?'#2d9bff':x.col,1.6,[5,4]);
  });
  if(cur!=null){const x=X(cur);g.save();g.strokeStyle='#fff';g.globalAlpha=.6;g.beginPath();g.moveTo(x,T);g.lineTo(x,T+ph);g.stroke();g.restore()}
}
// Σύνδεση γραφημάτων με αφή (δείχνει τιμές στις στροφές που πατάς)
function dyBind(runs){
  const cv=$('#dy_cv'),cv2=$('#dy_cv2'),ro=$('#dy_ro'),c=dCar(),u=dU(c);
  const hh=Math.round(Math.max(200,Math.min(380,$('#sp').clientHeight*.5)));cv.style.height=hh+'px';cv2.style.height=Math.round(hh*.42)+'px';
  let cur=null;
  const leg=()=>runs.length===1
    ?'<span><i style="background:'+runs[0].col+'"></i>'+u[0]+' κινητήρα</span><span><i style="background:'+runs[0].col+';opacity:.45"></i>'+u[0]+' τροχοί</span><span><i class="ds"></i>Nm</span>'
      +(runs[0].pts.some(p=>p.a!=null)?'<span><i style="background:#ffb020"></i>AFR</span>':'')+(runs[0].pts.some(p=>p.b!=null&&p.b>.05)?'<span><i class="ds" style="border-color:#2d9bff"></i>Boost '+UN().p+'</span>':'')
    :runs.map(x=>'<span><i style="background:'+x.col+'"></i>'+esc(x.n)+'</span>').join('')+'<span>— '+u[0]+'</span><span>- - Nm</span>';
  const rd=()=>{
    dyChart(cv,runs,cur,c.pu);dyChart2(cv2,runs,cur);
    let h='<div class="dylg">'+leg()+'</div>';
    if(cur!=null){h+='<div class="dyrv"><b>'+Math.round(cur)+' rpm</b>';
      runs.forEach(x=>{let q=null;x.pts.forEach(p=>{if(Math.abs(p.r-cur)<=150&&(!q||Math.abs(p.r-cur)<Math.abs(q.r-cur)))q=p});
        if(q)h+='<span><i style="background:'+x.col+'"></i>'+(q.p/u[1]).toFixed(1)+' '+u[0]+' · '+q.q.toFixed(0)+' Nm'+(q.a!=null?' · AFR '+q.a.toFixed(1):'')+(q.b!=null&&q.b>.05?' · '+fromBase('boost',q.b).toFixed(2)+' '+UN().p:'')+'</span>'});
      h+='</div>'}else h+='<div class="h">Πάτα πάνω στο γράφημα για τιμές σε κάθε στροφή.</div>';
    ro.innerHTML=h};
  const hit=(el,ev)=>{const rc=el.getBoundingClientRect(),x=rot?ev.clientY-rc.top:ev.clientX-rc.left;return cv._r?cv._r(x):null};
  [cv,cv2].forEach(el=>{let dn=false;
    el.onpointerdown=ev=>{dn=true;try{el.setPointerCapture(ev.pointerId)}catch(e){}cur=hit(el,ev);rd()};
    el.onpointermove=ev=>{if(dn){cur=hit(el,ev);rd()}};
    el.onpointerup=el.onpointercancel=()=>{dn=false}});
  DY.redraw=rd;rd();
}

// Σελίδα: Νέα μέτρηση
function dyRun(){
  dyLeave();
  const c=dCar(),G=dGears(c);if(!G.includes(c.gear))c.gear=G[0]||1;
  const warn=dyS0().car.ok?'':'<div class="dyw">Συμπλήρωσε πρώτα τα στοιχεία αυτοκινήτου για σωστό αποτέλεσμα. <button id="dy_gc">Στοιχεία αυτοκινήτου</button></div>';
  dySP('Νέα μέτρηση',warn
    +'<div class="dyt"><div><small>Στροφές</small><b id="dl_r">-</b></div><div><small>Ταχύτητα ('+spU()+')</small><b id="dl_v">-</b></div><div><small>TPS %</small><b id="dl_p">-</b></div><div><small>Χρόνος (s)</small><b id="dl_t">-</b></div></div>'
    +'<div id="dy_msg" class="dym"></div>'
    +'<div id="dy_ctl"><label>Ταχύτητα μέτρησης</label><select id="dy_g">'+G.map(g=>'<option value="'+g+'"'+(g===c.gear?' selected':'')+'>'+g+'</option>').join('')+'</select>'
    +'<div class="dyb"><button id="dy_go" class="pri">Έναρξη</button><button id="dy_st">Διακοπή</button></div></div>'

      return '<div class="dyr'+(i>=0?' on':'')+'" data-id="'+r.id+'"><i style="'+(i>=0?'background:'+DCOL[i]:'')+'"></i><div class="dyn"><b>'+esc(r.n)+'</b><small>'+(r.car?esc(r.car)+' · ':'')+d+' · Ταχύτητα μέτρησης: '+r.g+'</small></div>'

  $('#dh_l').onclick=e=>{

    if(dl){if(!confirm(t('Διαγραφή μέτρησης;')))return;const id=+dl.dataset.del,ix=R.findIndex(r=>r.id===id);if(ix>=0)R.splice(ix,1);save();
      if(!R.length){dyHist();return}DY.sel=DY.sel.filter(x=>x!==id);if(!DY.sel.length)DY.sel=[R[R.length-1].id];draw();return}

    if(i>=0){if(DY.sel.length>1)DY.sel.splice(i,1)}else{if(DY.sel.length>=4)DY.sel.shift();DY.sel.push(id)}

}

function splash(){
  const e=$('#splash');
  if(S.logo===false){e.remove();return}
  const go=()=>{e.classList.add('out');setTimeout(()=>e.remove(),800)};e.onclick=go;
  if(S.logoi){e.innerHTML='<img src="'+S.logoi+'" style="max-width:80%;max-height:80%">';setTimeout(go,2200);return}
  const k=Math.min(.8*e.offsetWidth/SPL.w,.8*e.offsetHeight/SPL.h);
  e.innerHTML='<svg width="'+SPL.w*k+'" height="'+SPL.h*k+'" viewBox="0 0 '+SPL.w+' '+SPL.h+'"><defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="-202" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fc5a0e"/><stop offset="1" stop-color="#f20a18"/></linearGradient></defs><image href="'+SPL.img+'" width="'+SPL.w+'" height="'+SPL.h+'"/><g id="sn"><polygon fill="url(#ng)" points="-25,-1.5 14,-28 0,-202"/><circle r="24.3" fill="#fc5a0e"/></g></svg>';
  const n=$('#sn'),t0=performance.now(),A0=-60,A1=97,R=SPL.rest,ez=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  (function f(t){
    const q=t-t0;let a;
    if(q<150)a=A0;else if(q<1400)a=A0+(A1-A0)*ez((q-150)/1250);else if(q<2000){const u=(q-1400)/600;a=A1+(R-A1)*(1-Math.pow(1-u,3))}else a=R;
    n.setAttribute('transform','translate('+SPL.x+' '+SPL.y+') rotate('+a+')');
    if(q<2000&&document.body.contains(n))requestAnimationFrame(f);
  })(t0);
  setTimeout(go,2700);
}
