<style>

button{font-weight:600}

#logo{display:flex;align-items:center;justify-content:center}
#top{position:relative;z-index:1;height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px}
#hb{font-size:24px;border:0;background:none;padding:2px 10px}

.w{position:absolute;background:none;border:2px solid transparent;border-radius:12px;container-type:size;overflow:hidden;touch-action:none}
.w.g,.w.g.al{background:none;border-color:transparent}

.sl{width:100%;height:100%;display:flex;flex-direction:column-reverse;align-items:center;justify-content:space-evenly}
.dt{display:block;width:min(86cqw,calc(86cqh/var(--n)));aspect-ratio:1;border-radius:50%;background:#5a5a5a}

.bx{padding:3cqmin 5cqmin;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.bn{font-size:12cqmin;color:var(--pc,var(--mut))}

#mn button.ms b{color:#fff;font-weight:600;margin-left:auto;padding-left:10px}#mn button.ms i{display:inline-flex;margin-left:8px}#mn button.ms svg{width:22px;height:22px}

S.pages=S.pages||[{n:'Σελίδα 1',w:[]}];while(S.pages.length<3)S.pages.push({n:'Σελίδα '+(S.pages.length+1),w:[]});S.cur=S.cur||0;if(S.cur>=S.pages.length)S.cur=0;S.ch=S.ch||{};
if(S.baro==null)S.baro=100;S.col=S.col||'#ff2d2d';

const DICT=[
['Χρώμα περιφερειακών γραμμάτων','Secondary text color'],['Τέλος τόξου από (%) (100 = όχι)','Arc end from (%) (100 = off)'],['Χρώμα τέλους τόξου','Arc end color'],['Χρώμα γραμμάτων','Text color'],['Χρώμα τόξου','Arc color'],['Χρώμα τιμής','Value color'],
['Επεξεργασία Layout','Edit Layout'],['Συναγερμοί','Alarms'],['Μονάδες εμφάνισης','Display Units'],['Συνδεσιμότητα','Connectivity'],['Σύνδεση Bluetooth','Bluetooth Connection'],['Προσανατολισμός οθόνης','Screen Orientation'],['Μονάδα θερμοκρασίας','Temperature Unit'],['Μονάδα ταχύτητας','Speed Unit'],['Μονάδα πίεσης','Pressure Unit'],['Ρυθμίσεις','Settings'],['Μενού','Menu'],['Κλειδωμένο','Locked'],['Ξεκλείδωτο','Unlocked'],['Κλείδωμα','Lock'],['Προσανατολισμός','Orientation'],['Μπαταρία (Volt)','Battery (Volt)'],['Έξτρα οθόνες','Extra screens'],['Οθόνη','Screen'],['Όχι','No'],
['Όταν είναι ενεργή, μπαίνει στο layout και τη μετακινείς ή τη μεγαλώνεις. Στην επεξεργασία, πάτα πάνω της για χρώματα και αριθμό LED.','When on, it is added to the layout and you can move or resize it. In edit mode, tap it for colors and LED count.'],
['ID σε hex όπως στην αναφορά. Τιμή = ωμή × (πολλαπλ.) + (σταθερά).','IDs in hex as in the report. Value = raw × (multiplier) + (offset).'],
['Σύρε · τράβα τη γωνία · πάτα για ρυθμίσεις · ✓ αποθήκευση','Drag · pull the corner · tap for settings · ✓ save'],
['Η φωτογραφία δεν χωράει στη μνήμη. Δοκίμασε μικρότερη.','The photo does not fit in memory. Try a smaller one.'],
['Διαγραφή όλων των ρυθμίσεων και των οργάνων;','Delete all settings and gauges?'],
['Πώς θες να χρησιμοποιείς την εφαρμογή;','How do you want to use the app?'],
['Ατμοσφαιρική πίεση (kPa) για το boost','Atmospheric pressure (kPa) for boost'],
['(αλλάζει από το μενού Shift light).','(change it in the Shift light menu).'],
['Μέγιστες στροφές κινητήρα τώρα:','Engine max rpm now:'],
['Συναγερμός AFR πάνω από','AFR alert above'],['(μόνο με boost','(only when boost'],
['Αναβόσβημα οθόνης στις στροφές','Screen flash at rpm'],
['Το logo δεν χωράει στη μνήμη.','The logo does not fit in memory.'],
['Άνοιξε τη σελίδα στο Bluefy','Open this page in Bluefy'],
['Αρχίζει στο % των στροφών','Starts at % of rpm'],
['Μέγιστες στροφές κινητήρα','Engine max rpm'],
['Κλίμακα αναλογικού, από','Gauge scale, from'],['Κλίμακα αναλογικού, έως','Gauge scale, to'],
['Βαθμονόμηση καναλιών','Channel calibration'],
['Οριζόντια (landscape)','Landscape'],['Κάθετη (portrait)','Portrait'],
['Χρώματα (1ο, 2ο, 3ο)','Colors (1st, 2nd, 3rd)'],
['Αφαίρεση φωτογραφίας','Remove photo'],

['Χρώμα αναβοσβήματος','Flash color'],['Εμφάνιση στο layout','Show in layout'],
['Μετονομασία σελίδας','Rename page'],['Χρώμα σβηστού LED','Unlit LED color'],
['Προσανατολισμός:','Orientation:'],['LED μπάρα στροφών','RPM LED bar'],
['Όλα τα ID (ωμές):','All IDs (raw):'],['Φωτογραφία φόντου','Background photo'],
['Διαγραφή σελίδας;','Delete page?'],['Διαγραφή σελίδας','Delete page'],
['Φόντο και logo','Background and logo'],['Χρώμα κλίμακας','Scale color'],
['Επαναφορά logo','Reset logo'],['Θέμα οργάνων','Gauge theme'],['Επαναφορά όλων','Reset all'],
['Δικό σου logo','Your own logo'],['Σύνδεση EMUBT','Connect EMUBT'],['Όνομα σελίδας','Page name'],
['Μπαταρία','Battery'],['Αποσυνδέθηκε','Disconnected'],['Νέο όργανο','New gauge'],['Νέα σελίδα','New page'],
['Ψηφιακό LCD','Digital LCD'],['LED τόξο','LED arc'],['Απλό','Simple'],['Κύριο χρώμα','Main color'],
['Αριθμός LED','LED count'],['Βαθμονόμηση','Calibration'],['Αποθήκευση','Save'],['Νερό','Water'],
['Αναλογικό','Analog'],['Σελίδα','Page'],['Κλείσιμο','Close'],['Διαγραφή','Delete'],['Εμφάνιση','Show'],
['Κουτάκι','Tile'],['Σφάλμα:','Error:'],['ΣΕΛΙΔΕΣ','PAGES'],['ΑΛΛΑ','OTHER'],['Κανάλι','Channel'],
['Ένταση','Intensity'],['Τύπος','Type'],['Φόντο','Background'],['Ωμή','Raw'],['Όργανο','Gauge'],
['Κάθετη','Portrait'],['Οριζόντια','Landscape'],['ΝΑΙ','ON'],['ΟΧΙ','OFF']
].sort((a,b)=>b[0].length-a[0].length);
const GRX=/[\u0370-\u03FF\u1F00-\u1FFF]/;
const t=x=>{if(S.lang!=='en'||typeof x!=='string'||!GRX.test(x))return x;for(const d of DICT)if(x.includes(d[0]))x=x.split(d[0]).join(d[1]);return x};
function trNode(n){
  if(n.nodeType===3){const v=n.nodeValue;if(GRX.test(v)){const w=t(v);if(w!==v)n.nodeValue=w}}
  else if(n.nodeType===1&&n.tagName!=='SCRIPT'&&n.tagName!=='STYLE')n.childNodes.forEach(trNode);
}
new MutationObserver(ms=>{if(S.lang!=='en')return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
function setLang(l){S.lang=l;save();document.documentElement.lang=l;if(l==='en')trNode(document.body);else{closeD();build();menu()}}
let edit=false,demo=false,buf=[],cal=false,rot=false;const raw={},mm={},refs=new Map();
function fit(){
  const b=document.body,w=innerWidth,h=innerHeight;const lk=S.olock!==false;b.classList.toggle('ls',lk?S.orient!=='p':w>h);
  rot=lk&&S.orient!=='p'&&h>w;
  if(rot)Object.assign(b.style,{position:'fixed',left:'0',top:'0',width:h+'px',height:w+'px',transformOrigin:'0 0',transform:'translateX('+w+'px) rotate(90deg)'});
  else b.removeAttribute('style');
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));

const UN=()=>S.u||(S.u={t:'C',s:'kmh',p:'bar'});
const KIND={ect:'t',iat:'t',spd:'s',map:'p',boost:'p'};
function fromBase(k,v,u){u=u||UN();if(v==null)return v;const d=KIND[k];
  if(d==='t')return u.t==='F'?v*1.8+32:v;
  if(d==='s')return u.s==='mph'?v*.621371:v;
  if(k==='map')return u.p==='psi'?v*.145038:v/100;
  if(k==='boost')return u.p==='psi'?v*14.5038:v;
  return v}
function toBase(k,v,u){u=u||UN();const d=KIND[k];
  if(d==='t')return u.t==='F'?(v-32)/1.8:v;
  if(d==='s')return u.s==='mph'?v/.621371:v;
  if(k==='map')return u.p==='psi'?v/.145038:v*100;
  if(k==='boost')return u.p==='psi'?v/14.5038:v;
  return v}
function setUnit(kind,val){
  const old={...UN()},nu={...old,[kind]:val};
  for(const p of S.pages)for(const w of p.w){if(w.t==='s'||KIND[w.k]!==kind)continue;
    for(const f of ['lo','hi','min','max'])if(on(w[f]))w[f]=+fromBase(w.k,toBase(w.k,w[f],old),nu).toFixed(2)}
  S.u=nu;for(const k in mm)delete mm[k];save();build();
}
const dec=c=>KIND[c.k]==='p'?(UN().p==='psi'?1:2):c.d;
const dmin=c=>+fromBase(c.k,c.min).toFixed(2),dmax=c=>+fromBase(c.k,c.max).toFixed(2);
function cn(c){let n=c.n;const u=UN();
  if(c.k==='ect'||c.k==='iat')n=n.replace('°C','°'+u.t);else if(c.k==='spd')n=n.replace('km/h',u.s==='mph'?'mph':'km/h');
  else if(c.k==='map')n=n.replace('kPa',u.p);else if(c.k==='boost')n=n.replace('bar',u.p);return n}
function bv(c){
  if(c.k==='boost'){const m=bv(M.map);return m==null?null:(m-S.baro)/100}
  const id=get(c,'id');if(id==null||raw[id]===undefined)return null;
  return raw[id]*get(c,'s')+get(c,'o');
}
function val(c){return fromBase(c.k,bv(c))}
const pt=a=>{const r=a*Math.PI/180;return(50+38*Math.sin(r)).toFixed(1)+' '+(55-38*Math.cos(r)).toFixed(1)};

function mk(w){
  if(w.t==='s')return mkS(w);
  const c=M[w.k],d=document.createElement('div');d.className='w'+(w.t==='g'?' g':'');pos(d,w);
  d.innerHTML=(w.t==='g'
   ?gsvg(eff(w),(S.theme==='c'?'l':S.theme)||'l')
   :`<div class="bx"><div class="bn">${cn(c)}</div><div class="bv">-</div><div class="bm"><span>Min <b>-</b></span><span>Max <b>-</b></span></div></div>`)
   +'<div class="rz"></div>';
  d.addEventListener('pointerdown',e=>drag(e,w,d));
  colors(d,w);d._w=w;refs.set(w,d);return d;

function colors(d,w){
  if(w.t==='g'){const tc=w.tc||'#ffffff',ac=w.ac||S.c1||'#ff2d2d';d.style.setProperty('--c1',tc);d.style.setProperty('--c2',tc);d.style.setProperty('--arc',ac);d.style.setProperty('--arce',w.ec||ac)}

}
// Θέματα αναλογικών οργάνων
const P=(r,a,cx=50,cy=55)=>{const t=a*Math.PI/180;return[+(cx+r*Math.sin(t)).toFixed(1),+(cy-r*Math.cos(t)).toFixed(1)]};
function lbls(a,b){const r=b-a,m=Math.pow(10,Math.floor(Math.log10(r/6))),f=[1,2,2.5,5,10].find(x=>r/(x*m)<=7)*m,o=[];for(let v=Math.ceil(a/f-1e-9)*f;v<=b+1e-9;v+=f)o.push(+v.toFixed(6));return o}
const SG={a:'M2 0H8L9 1L8 2H2L1 1Z',d:'M2 16H8L9 17L8 18H2L1 17Z',g:'M2 8H8L9 9L8 10H2L1 9Z',b:'M9 1L10 2V8L9 9L8 8V2Z',c:'M9 10L10 11V16L9 17L8 16V11Z',f:'M1 1L2 2V8L1 9L0 8V2Z',e:'M1 10L2 11V16L1 17L0 16V11Z'};
const DG={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g'};
function seg7(str,x,y,sx,sy,al,sk){
  let tw=0;for(const ch of str)tw+=ch==='.'?4:12;tw-=2;

function build(){

  st.classList.toggle('ed',edit);$('#pa').style.display=(S.cur===S.pages.length-1&&S.pages.length<5&&!edit)?'':'none';$('#hb').textContent=edit?'✓':'☰';$('#hb').style.color=edit?'#4cd07d':'';

function drag(e,w,d){
  if(!edit)return;
  const r=$('#stage').getBoundingClientRect(),rz=e.target.classList.contains('rz');
  const sx=e.clientX,sy=e.clientY,o={...w};let mv=false;d.setPointerCapture(e.pointerId);
  const m=ev=>{
    if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>6)mv=true;
    const dx=rot?(ev.clientY-sy)/r.height*100:(ev.clientX-sx)/r.width*100,dy=rot?-(ev.clientX-sx)/r.width*100:(ev.clientY-sy)/r.height*100;
    if(rz){w.w=cl(sn(o.w+dx),10,100-w.x);w.h=cl(sn(o.h+dy),10,100-w.y)}
    else{w.x=cl(sn(o.x+dx),0,100-w.w);w.y=cl(sn(o.y+dy),0,100-w.h)}
    pos(d,w)};
  const u=()=>{d.removeEventListener('pointermove',m);d.removeEventListener('pointerup',u);d.removeEventListener('pointercancel',u);save();if(!mv&&!rz)dlgW(w,false)};
  d.addEventListener('pointermove',m);d.addEventListener('pointerup',u);d.addEventListener('pointercancel',u);
}
setInterval(()=>{
  if(demo)sim();
  for(const w of S.pages[S.cur].w){
    const d=refs.get(w);if(!d)continue;
    if(w.t==='s'){const r=val(M.rpm);sup(d,w,r==null?0:r);continue}const c=M[w.k],v=val(c);if(v==null)continue;
    const m=mm[c.k]||(mm[c.k]={a:v,b:v});m.a=Math.min(m.a,v);m.b=Math.max(m.b,v);
    let ac=null;
    if(on(w.hi)&&v>w.hi)ac=w.hc||'#ff2d2d';else if(on(w.lo)&&v<w.lo)ac=w.lc||'#2d7bff';
    if(c.k==='afr'&&on(S.lean)&&bv(M.boost)>.2&&v>S.lean&&!ac)ac='#ff2d2d';
    d.classList.toggle('al',!!ac);if(ac)d.style.setProperty('--al',ac);
    if(w.t==='g')gupd(d,eff(w),c,v,m.b);
    else{d.querySelector('.bv').textContent=v.toFixed(dec(c));const b=d.querySelectorAll('.bm b');b[0].textContent=m.a.toFixed(dec(c));b[1].textContent=m.b.toFixed(dec(c))}
  }
  const r=val(M.rpm);document.body.style.setProperty('--sl',S.col);
  document.body.classList.toggle('flash',on(S.shift)&&r!=null&&r>=S.shift);
  if(cal){for(const c of DEF){const e=$('#r_'+c.k),id=get(c,'id');if(e)e.textContent=id!=null&&raw[id]!==undefined?raw[id]:'-'}
    const a=$('#all');if(a)a.textContent=Object.keys(raw).map(Number).sort((x,y)=>x-y).map(k=>hx(k)+'='+raw[k]).join('  ')}
},100);
function sim(){const t=Date.now()/1000,w=Math.sin(t/2);
  raw[1]=Math.round(3500+3000*w);raw[2]=Math.round(100+80*Math.max(0,w));raw[3]=Math.round(40+40*w);
  raw[4]=46;raw[5]=504;raw[6]=77;raw[0x10]=Math.round(125+20*Math.sin(t))}

function dlgW(w,isNew){
  if(w.t==='s'){sdlg(w);return}
  const o=DEF.map(c=>`<option value="${c.k}"${c.k===w.k?' selected':''}>${cn(c)}</option>`).join('');
  const c0=M[w.k],th=(S.theme==='c'?'l':S.theme)||'l',mx=th==='e'?2:th==='l'||th==='s'?1:0,xs=w.xs||[];
  const op=v=>['peak','bat','afr'].map(k=>'<option value="'+k+'"'+(v===k?' selected':'')+'>'+({peak:'Peak',bat:'Μπαταρία (Volt)',afr:'AFR'})[k]+'</option>').join('');
  const xr=mx?'<label id="r_xn">Έξτρα οθόνες<select id="f_xn">'+[...Array(mx+1).keys()].map(i=>'<option value="'+i+'"'+(xs.length===i?' selected':'')+'>'+(i?i:'Όχι')+'</option>').join('')+'</select></label><label id="r_x1">Οθόνη 1<select id="f_x1">'+op(xs[0])+'</select></label><label id="r_x2">Οθόνη 2<select id="f_x2">'+op(xs[1])+'</select></label>':'';
  D(`<h3>${isNew?'Νέο όργανο':'Όργανο'}</h3>
  <label>Τύπος<select id="f_t"><option value="b"${w.t==='b'?' selected':''}>Κουτάκι</option><option value="g"${w.t==='g'?' selected':''}>Αναλογικό</option></select></label>
  <label>Κανάλι<select id="f_k">${o}</select></label>
  <label>Συναγερμός κάτω από<span><input id="f_lo" value="${w.lo??''}" style="width:72px"> <input type="color" id="f_lc" value="${w.lc||'#2d7bff'}" style="width:44px;padding:2px"></span></label>
  <label>Συναγερμός πάνω από<span><input id="f_hi" value="${w.hi??''}" style="width:72px"> <input type="color" id="f_hc" value="${w.hc||'#ff2d2d'}" style="width:44px;padding:2px"></span></label>
  <label id="r_min">Κλίμακα αναλογικού, από<input id="f_min" value="${w.min??dmin(c0)}"></label>
  <label id="r_max">Κλίμακα αναλογικού, έως<input id="f_max" value="${w.max??dmax(c0)}"></label>${xr}
  <label class="rg">Χρώμα γραμμάτων<input type="color" id="f_tc" value="${w.tc||'#ffffff'}" style="width:56px;padding:2px"></label>
  <label class="rg">Χρώμα τόξου<input type="color" id="f_ac" value="${w.ac||S.c1||'#ff2d2d'}" style="width:56px;padding:2px"></label>
  <label class="rg">Χρώμα τέλους τόξου<input type="color" id="f_ec" value="${w.ec||w.ac||S.c1||'#ff2d2d'}" style="width:56px;padding:2px"></label>
  <label class="rg">Τέλος τόξου από (%) (100 = όχι)<input id="f_ep" value="${w.ep??100}"></label>

  <div><button id="f_ok">Αποθήκευση</button> ${isNew?'':'<button id="f_del">Διαγραφή</button> '}<button id="f_x">Κλείσιμο</button></div>`);
  const syncT=()=>{const g=$('#f_t').value==='g';
    ['r_min','r_max'].forEach(i=>$('#'+i).style.display=g?'':'none');
    document.querySelectorAll('#dlg .rg').forEach(e=>e.style.display=g?'':'none');
    document.querySelectorAll('#dlg .rb').forEach(e=>e.style.display=g?'none':'');
    if(mx){$('#r_xn').style.display=g?'':'none';const n=+$('#f_xn').value;$('#r_x1').style.display=g&&n>=1?'':'none';$('#r_x2').style.display=g&&n>=2?'':'none'}};
  $('#f_t').onchange=syncT;if(mx)$('#f_xn').onchange=syncT;syncT();
  $('#f_k').onchange=()=>{const c=M[$('#f_k').value];$('#f_min').value=dmin(c);$('#f_max').value=dmax(c)};
  $('#f_x').onclick=closeD;
  if(!isNew)$('#f_del').onclick=()=>{const a=S.pages[S.cur].w;a.splice(a.indexOf(w),1);save();closeD();build()};
  $('#f_ok').onclick=()=>{
    const g=i=>{const v=$(i).value.trim();return v===''?null:Number(v)};

    w.vc=$('#f_vc').value==='#f2f2f2'?undefined:$('#f_vc').value;w.pc=$('#f_pc').value==='#8a8a8a'?undefined:$('#f_pc').value;if(mx){const n=+$('#f_xn').value;w.xs=[$('#f_x1').value,$('#f_x2').value].slice(0,n)}
    w.min=g('#f_min')??dmin(M[w.k]);w.max=g('#f_max')??dmax(M[w.k]);
    if(isNew){const a=S.pages[S.cur].w,n=a.length%6;Object.assign(w,w.t==='g'?{x:4+n*4,y:4+n*4,w:40,h:52}:{x:4+n*4,y:4+n*4,w:38,h:28});a.push(w)}
    save();closeD();build();
  };
}

function applyBg(){
  document.documentElement.style.setProperty('--c1',S.c1||'#ff2d2d');document.documentElement.style.setProperty('--c2',S.c2||'#ffffff');
  $('#bgl').style.background=S.bgi?'linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url('+S.bgi+') center/cover no-repeat':(S.bgc||'#000');
  const l=$('#logo');l.style.display=S.logo===false?'none':'flex';l.style.opacity=S.lop??0.16;
  l.innerHTML=S.logoi?'<img src="'+S.logoi+'" style="max-width:62%;max-height:70%">':LOGO;
}
function img(f,max,fmt,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/'+fmt,.82))};i.src=r.result};r.readAsDataURL(f)}
function bgPanel(){
  const sw=['#000000','#141414','#08121f','#160a0a','#0b140b'].map(c=>'<button data-c="'+c+'" style="background:'+c+';width:44px;height:44px;padding:0"></button>').join(' ');
  D(`<h3>Φόντο</h3><div>${sw} <input type="color" id="b_c" value="${S.bgc||'#000000'}" style="width:56px;padding:2px"></div>
  <label>Φωτογραφία φόντου<input type="file" id="b_i" accept="image/*" style="width:190px"></label><button id="b_ri">Αφαίρεση φωτογραφίας</button>
  <h3 style="margin-top:14px">Logo</h3>
  <label>Εμφάνιση<input type="checkbox" id="l_s"${S.logo!==false?' checked':''} style="width:auto"></label>
  <label>Ένταση<input type="range" id="l_o" min="0" max="30" value="${Math.round((S.lop??.16)*100)}" style="width:150px"></label>
  <label>Δικό σου logo<input type="file" id="l_i" accept="image/*" style="width:190px"></label>
  <div><button id="l_r">Επαναφορά logo</button> <button id="f_x">Κλείσιμο</button></div>`);
  $('#dlg').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.bgc=b.dataset.c;S.bgi=null;save();applyBg()});
  $('#b_c').onchange=e=>{S.bgc=e.target.value;S.bgi=null;save();applyBg()};
  $('#b_i').onchange=e=>img(e.target.files[0],1280,'jpeg',u=>{S.bgi=u;if(!save()){S.bgi=null;alert(t('Η φωτογραφία δεν χωράει στη μνήμη. Δοκίμασε μικρότερη.'))}applyBg()});
  $('#b_ri').onclick=()=>{S.bgi=null;save();applyBg()};
  $('#l_s').onchange=e=>{S.logo=e.target.checked;save();applyBg()};
  $('#l_o').oninput=e=>{S.lop=e.target.value/100;applyBg()};$('#l_o').onchange=()=>save();
  $('#l_i').onchange=e=>img(e.target.files[0],600,'png',u=>{S.logoi=u;if(!save()){S.logoi=null;alert(t('Το logo δεν χωράει στη μνήμη.'))}applyBg()});
  $('#l_r').onclick=()=>{S.logoi=null;save();applyBg()};
  $('#f_x').onclick=closeD;
}

// Bluetooth, μόνο ανάγνωση (FFE1 notify)
function parse(){while(buf.length>=5){
  if(buf[1]===0xA3&&((buf[0]+buf[1]+buf[2]+buf[3])&255)===buf[4]){raw[buf[0]]=(buf[2]<<8)|buf[3];buf.splice(0,5)}else buf.shift()}}
async function connect(){
  if(!navigator.bluetooth){$('#st').textContent='Άνοιξε τη σελίδα στο Bluefy';return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'EMU'}],optionalServices:[0xffe0]});
    dev.addEventListener('gattserverdisconnected',()=>{$('#st').dataset.l='Αποσυνδέθηκε';$('#st').textContent='Αποσυνδέθηκε'});
    const s=await dev.gatt.connect(),sv=await s.getPrimaryService(0xffe0),ch=await sv.getCharacteristic(0xffe1);
    ch.addEventListener('characteristicvaluechanged',e=>{const d=e.target.value;for(let i=0;i<d.byteLength;i++)buf.push(d.getUint8(i));parse()});
    await ch.startNotifications();
    demo=false;for(const k in raw)delete raw[k];for(const k in mm)delete mm[k];
    $('#st').dataset.l='Live: '+(dev.name||'');$('#st').textContent=$('#st').dataset.l;
    try{await navigator.wakeLock.request('screen')}catch(e){}
  }catch(e){$('#st').textContent='Σφάλμα: '+e.message}
}

}

$('#stage').addEventListener('pointerdown',e=>{
  $('#mn').classList.remove('open');

  if(!ch&&(!wd||!edit))sw={x:e.clientX,y:e.clientY};
  if(!edit||wd||ch)return;
  const x0=e.clientX,y0=e.clientY;let t;
  const cancel=()=>{clearTimeout(t);removeEventListener('pointermove',mv);removeEventListener('pointerup',cancel);removeEventListener('pointercancel',cancel)};
  const mv=ev=>{if(Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)>10)cancel()};
  addEventListener('pointermove',mv);addEventListener('pointerup',cancel);addEventListener('pointercancel',cancel);
  t=setTimeout(()=>{cancel();sw=null;dlgW({t:'b',k:'rpm'},true)},550);
});
addEventListener('pointerup',e=>{
  if(!sw)return;const dx=rot?(e.clientY-sw.y):(e.clientX-sw.x),dy=rot?-(e.clientX-sw.x):(e.clientY-sw.y);sw=null;
  if(Math.abs(dx)>50&&Math.abs(dy)<80){const n=S.cur+(dx<0?1:-1);if(n>=0&&n<S.pages.length){S.cur=n;save();build()}}
});

  else if(a==='t'){cm();thPanel()}

});

function splash(){
  const e=$('#splash');
  if(S.logo===false){e.remove();return}
  const go=()=>{e.classList.add('out');setTimeout(()=>e.remove(),800)};e.onclick=go;
  if(S.logoi){e.innerHTML='<img src="'+S.logoi+'" style="max-width:80%;max-height:80%">';setTimeout(go,2200);return}
  const k=Math.min(.8*e.offsetWidth/SPL.w,.8*e.offsetHeight/SPL.h);
  e.innerHTML='<svg width="'+SPL.w*k+'" height="'+SPL.h*k+'" viewBox="0 0 '+SPL.w+' '+SPL.h+'"><defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="-202" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fc5a0e"/><stop offset="1" stop-color="#f20a18"/></linearGradient></defs><image href="'+SPL.img+'" width="'+SPL.w+'" height="'+SPL.h+'"/><g id="sn"><polygon fill="url(#ng)" points="-25,-1.5 14,-28 0,-202"/><circle r="24.3" fill="#fc5a0e"/></g></svg>';
  const n=$('#sn'),t0=performance.now(),A0=-60,A1=97,R=SPL.rest,ez=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  (function f(t){
    const q=t-t0;let a;
    if(q<150)a=A0;else if(q<1400)a=A0+(A1-A0)*ez((q-150)/1250);else if(q<2000){const u=(q-1400)/600;a=A1+(R-A1)*(1-Math.pow(1-u,3))}else a=R;
    n.setAttribute('transform','translate('+SPL.x+' '+SPL.y+') rotate('+a+')');
    if(q<2000&&document.body.contains(n))requestAnimationFrame(f);
  })(t0);
  setTimeout(go,2700);
}
applyBg();fit();build();splash();if(S.lang==='en')trNode(document.body);
